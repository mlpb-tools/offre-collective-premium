<style id="v35-visual-system">
  /* V35 — évolution visuelle MLPB : plus calme, plus hiérarchisée, mêmes fonctions. */
  :root{
    --v35-ink:#202a33;
    --v35-muted:#61707c;
    --v35-line:#d9e1e7;
    --v35-surface:#ffffff;
    --v35-soft:#f5f7f9;
    --v35-success:#267a52;
    --v35-info:#2166a5;
    --v35-warning:#a76500;
    --v35-danger:#c83345;
    --v35-radius:16px;
    --v35-shadow:0 8px 24px rgba(32,42,51,.09);
  }

  /* Une seule hiérarchie de boutons. */
  .btn,.btn.mini{
    border-radius:10px !important;
    box-shadow:none !important;
    font-weight:750 !important;
    letter-spacing:0 !important;
    text-transform:none !important;
  }
  .btn:hover:not(:disabled){transform:translateY(-1px) !important;box-shadow:0 4px 12px rgba(32,42,51,.12) !important;}
  .btn.primary{background:var(--v35-ink) !important;border-color:var(--v35-ink) !important;color:#fff !important;}
  .btn.subtle{background:#fff !important;border-color:#bfcad2 !important;color:var(--v35-ink) !important;}
  .btn.danger-outline{background:#fff !important;border-color:#e3b5bc !important;color:var(--v35-danger) !important;}
  .icon-action{box-shadow:none !important;border-color:#cbd4db !important;}

  /* En-tête : moins d'effets, meilleure lecture. */
  .app-header{background:rgba(255,255,255,.96) !important;box-shadow:0 1px 0 rgba(32,42,51,.12) !important;}
  .segmented{border:1px solid #c8d1d8 !important;box-shadow:none !important;background:var(--v35-soft) !important;}
  .segmented button{font-weight:750 !important;color:#52616d !important;}
  .segmented button.active{background:var(--v35-ink) !important;color:#fff !important;}
  .territory-filter select{border-color:#c8d1d8 !important;box-shadow:none !important;}

  /* Accueil jeunes : identité colorée préservée, alignements renforcés. */
  body.mode-jeune .mindmap-grid{border:2px solid #202a33 !important;border-radius:24px !important;box-shadow:0 14px 36px rgba(32,42,51,.13) !important;}
  body.mode-jeune .tile{box-shadow:none !important;transform:none !important;}
  body.mode-jeune .tile:hover{filter:brightness(1.025);transform:none !important;}
  body.mode-jeune .tile-head{justify-content:center;}
  body.mode-jeune .tile h2{font-size:16px !important;line-height:1.18 !important;letter-spacing:.018em !important;}
  body.mode-jeune .tile .intro{font-size:13px !important;line-height:1.36 !important;max-width:300px !important;}
  body.mode-jeune .icon{opacity:.94;}

  /* Espace conseiller : surfaces neutres et repères colorés discrets. */
  body.mode-conseiller{background:#eef2f5 !important;}
  body.mode-conseiller .app-header{border-bottom:3px solid #a3195b !important;}
  .advisor-badge{
    display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;
    background:#f6eaf0;color:#801347;border:1px solid #e4bfd0;font-size:10.5px;font-weight:800;white-space:nowrap;
  }
  .advisor-badge::before{content:'●';font-size:8px;color:var(--v35-success);}
  body.mode-conseiller .mindmap-grid{gap:12px !important;background:transparent !important;border:0 !important;box-shadow:none !important;overflow:visible !important;}
  body.mode-conseiller .tile{
    border:1px solid rgba(32,42,51,.16) !important;
    border-radius:var(--v35-radius) !important;box-shadow:var(--v35-shadow) !important;
  }
  body.mode-conseiller .tile.blue{background:linear-gradient(135deg,#2897d5 0%,#1f7fb5 100%) !important;color:#fff !important;}
  body.mode-conseiller .tile.pink{background:linear-gradient(135deg,#a3195b 0%,#7d174f 100%) !important;color:#fff !important;}

<style id="v11-conseiller-polish">
  /* ====== Fondations : mouvement, focus, icônes ====== */
  :root{
    --cs-surface:#ffffff;
    --cs-surface-alt:#f6f8fa;
    --cs-line:#e2e8ee;
    --cs-line-strong:#cdd8e0;
    --cs-ink:#1c2833;
    --cs-muted:#5c6b78;

    --cs-danger:#c62839;

    *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  }
  .icon-svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;vertical-align:-3px}

  .atelier-resource-link{margin:2px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .atelier-resource-name{font-size:12px;font-weight:800;color:#52606b;overflow-wrap:anywhere;}
  .atelier-resource-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .atelier-toggle .icon-svg,.summary-toggle .icon-svg{transition:transform .15s var(--cs-ease);}
  .atelier-toggle.is-open .icon-svg{transform:rotate(180deg);}

  /* ====== Boutons : hiérarchie claire et icônes ====== */
  body.mode-conseiller .btn{display:inline-flex;align-items:center;gap:7px;font-weight:700;transition:transform .12s var(--cs-ease), box-shadow .12s var(--cs-ease), background-color .12s var(--cs-ease);}
  body.mode-conseiller .btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--cs-shadow-sm);}
  body.mode-conseiller .btn:active:not(:disabled){transform:translateY(0);}
  body.mode-conseiller .btn.subtle{background:rgba(255,255,255,.65);border-color:var(--cs-line-strong);color:var(--cs-ink);}
  body.mode-conseiller .btn.danger-outline{background:#fff;color:var(--cs-danger);border-color:#e6b8bd;}
  body.mode-conseiller .btn.danger-outline:hover{background:var(--cs-danger-soft);}
  body.mode-conseiller .icon-action{display:inline-flex;align-items:center;justify-content:center;transition:transform .12s var(--cs-ease), background-color .12s var(--cs-ease), color .12s var(--cs-ease);}
  body.mode-conseiller .icon-action:hover:not(:disabled){transform:scale(1.06);}
  body.mode-conseiller .icon-action:active:not(:disabled){transform:scale(.96);}

  /* ====== Surfaces de gestion : lisibilité premium côté conseiller ====== */
  body.mode-conseiller .tile-body{background:var(--cs-surface-alt) !important;border-radius:16px;padding:14px 12px !important;}
  body.mode-conseiller .subcategory{background:var(--cs-surface) !important;border:1px solid var(--cs-line) !important;color:var(--cs-ink) !important;border-radius:var(--cs-radius);box-shadow:var(--cs-shadow-sm);transition:box-shadow .15s var(--cs-ease), transform .15s var(--cs-ease);}
  body.mode-conseiller .subcategory:hover{box-shadow:var(--cs-shadow-md);transform:translateY(-1px);}
  body.mode-conseiller .subcategory-title{color:var(--cs-ink) !important;font-weight:800;}
  body.mode-conseiller .subcategory .count{background:var(--cs-surface-alt) !important;border:1px solid var(--cs-line-strong);color:var(--cs-ink) !important;}
  body.mode-conseiller .subcategory .icon-action{border-color:var(--cs-line-strong);color:var(--cs-ink);background:var(--cs-surface);}
  body.mode-conseiller .category-workshops .atelier,
  body.mode-conseiller .atelier{background:var(--cs-surface) !important;border:1px solid var(--cs-line) !important;color:var(--cs-ink) !important;box-shadow:var(--cs-shadow-sm);transition:box-shadow .15s var(--cs-ease);}
  body.mode-conseiller .atelier:hover{box-shadow:var(--cs-shadow-md);}
  body.mode-conseiller .atelier-title{color:var(--cs-ink) !important;}
  body.mode-conseiller .atelier-toggle,body.mode-conseiller .summary-toggle{border-color:var(--cs-line-strong);color:var(--cs-ink);background:var(--cs-surface-alt);}
  body.mode-conseiller .session-card,body.mode-conseiller .resource-wrap,body.mode-conseiller .field{background:var(--cs-surface) !important;border:1px solid var(--cs-line) !important;color:var(--cs-ink) !important;box-shadow:var(--cs-shadow-sm);}
  body.mode-conseiller .field b{color:var(--cs-muted) !important;}
  body.mode-conseiller .atelier-territories{background:var(--cs-surface-alt);border-color:var(--cs-line);}
  body.mode-conseiller .atelier-territory{background:var(--cs-surface);border-color:var(--cs-line-strong);color:var(--cs-ink) !important;}
  body.mode-conseiller .small-note,body.mode-conseiller .empty-note,body.mode-conseiller .management-hint{color:var(--cs-muted) !important;}
  body.mode-conseiller .resource-row input,body.mode-conseiller .participant-row input,body.mode-conseiller .participant-row select,
  body.mode-conseiller .session-form input,body.mode-conseiller .session-form textarea,body.mode-conseiller .field input,body.mode-conseiller .field textarea{
    background:var(--cs-surface-alt);border-color:var(--cs-line-strong);

  body.mode-conseiller .resource-row input:focus-visible,body.mode-conseiller .participant-row input:focus-visible,
  body.mode-conseiller .session-form input:focus-visible,body.mode-conseiller .session-form textarea:focus-visible{
    outline:2px solid var(--cs-accent);outline-offset:1px;background:#fff;
  }

  /* ====== Empty states : invitation claire à agir ====== */
  body.mode-conseiller .empty-note{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--cs-surface-alt);border:1px dashed var(--cs-line-strong);border-radius:var(--cs-radius-sm);font-style:normal;}
  body.mode-conseiller .empty-note::before{content:'';width:6px;height:6px;border-radius:999px;background:var(--cs-accent);flex:0 0 auto;}

  /* ====== Demand badge et compteurs ====== */
  body.mode-conseiller .demand-badge{box-shadow:none;}

  /* ====== Modales : ouverture plus douce, hiérarchie claire ====== */
  .modal{transition:background-color .16s var(--cs-ease);}
  .modal-box{transform:translateY(8px) scale(.985);opacity:0;transition:transform .18s var(--cs-ease), opacity .18s var(--cs-ease);}
  .modal.open .modal-box{transform:translateY(0) scale(1);opacity:1;}
  .modal .actions .btn.primary{box-shadow:var(--cs-shadow-sm);}
  .modal label{display:flex;align-items:center;gap:6px;}
  .field-help{display:block;font-size:11px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--cs-muted);margin:-2px 0 6px;}
  .modal input:invalid,.modal-field-error input,.modal-field-error textarea{border-color:var(--cs-danger) !important;}
  .field-error-msg{display:block;font-size:11px;font-weight:700;color:var(--cs-danger);margin-top:4px;}

  /* ====== Confirmation de suppression, générique ====== */
  .delete-confirmation{display:flex;gap:12px;align-items:flex-start;}
  .delete-confirmation .dc-icon{flex:0 0 auto;width:38px;height:38px;border-radius:999px;background:var(--cs-danger-soft);color:var(--cs-danger);display:grid;place-items:center;}
  .delete-confirmation .dc-body{flex:1;min-width:0;}

  /* ====== Toasts ====== */
  #toastStack{position:fixed;right:18px;bottom:18px;z-index:400;display:flex;flex-direction:column;gap:10px;max-width:min(360px,88vw);}
  .toast{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;background:#1c2833;color:#fff;box-shadow:var(--cs-shadow-md);font-size:13px;font-weight:600;line-height:1.4;animation:toast-in .22s var(--cs-ease);}
  .toast.leaving{animation:toast-out .18s var(--cs-ease) forwards;}
  .toast .toast-icon{flex:0 0 auto;width:20px;height:20px;border-radius:999px;display:grid;place-items:center;background:rgba(255,255,255,.14);}
  .toast.success .toast-icon{background:var(--cs-success);color:#fff;}
  .toast.warning .toast-icon{background:var(--cs-warning);color:#fff;}
  .toast.danger .toast-icon{background:var(--cs-danger);color:#fff;}
  .toast .toast-close{margin-left:auto;background:none;border:0;color:rgba(255,255,255,.7);cursor:pointer;font-size:15px;line-height:1;padding:2px;}
  .toast .toast-close:hover{color:#fff;}
  @keyframes toast-in{from{opacity:0;transform:translateY(8px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes toast-out{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(6px);}}
  @media(max-width:600px){#toastStack{left:12px;right:12px;bottom:12px;max-width:none;}}

  /* ====== Repère de mode actif ====== */
  body.mode-conseiller .app-header{border-bottom-color:var(--cs-accent) !important;}
  body.mode-conseiller #modeConseillerBtn.active{background:var(--cs-accent) !important;border-color:var(--cs-accent) !important;}
</style>

/* ====== Migration RGPD : purge des données nominatives résiduelles ======
   Les inscriptions se font désormais exclusivement sur linscription.com ;
   cet outil ne conserve plus qu'un nombre d'inscrits par session. Cette
   fonction retire tout nom/contact/message qui aurait pu être enregistré
   avant cette évolution, en le convertissant en simple compteur avant
   suppression — aucune régression de la fonctionnalité de comptage,
   suppression complète de la donnée personnelle. */
function migratePrivacyData(data){
  let purgedParticipants = 0, purgedDemandes = 0;
  (data.blocks||[]).forEach(block=>{
    (block.categories||[]).forEach(category=>{
      (category.ateliers||[]).forEach(atelier=>{
        if(Array.isArray(atelier.demandesInscription)){
          purgedDemandes += atelier.demandesInscription.length;
          delete atelier.demandesInscription;
        }
        (atelier.sessions||[]).forEach(session=>{
          if(Array.isArray(session.participants)){
            if(typeof session.inscrits !== 'number') session.inscrits = session.participants.length;
            purgedParticipants += session.participants.length;
            delete session.participants;
          }
          if(!Array.isArray(session.avis)) session.avis = [];
        });
      });
    });
  });
  return {purgedParticipants, purgedDemandes};
}

function loadData(){
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved){
    try{
      const data=JSON.parse(saved);
      normalizeMobilityCategories(data);
      normalizeEmploymentCategories(data);
      normalizeV30Content(data);
      if(!Array.isArray(data.log)) data.log = [];
      if(!Array.isArray(data.ideesAteliers)) data.ideesAteliers = [];
      const migrated = migratePrivacyData(data);
      if(migrated.purgedParticipants || migrated.purgedDemandes){
        data.log.unshift({ts:new Date().toISOString(), action:'confidentialité', label:`Purge RGPD : ${migrated.purgedParticipants} inscription(s) nominative(s) et ${migrated.purgedDemandes} demande(s) converties en comptage anonyme`});
      }
      return data;
    }catch(e){}
  }
  // VERSION TEST : catalogue réel exporté le 08/10/2026
  const fresh = JSON.parse(JSON.stringify(TEST_REAL_DATA));
  normalizeMobilityCategories(fresh);
  normalizeEmploymentCategories(fresh);
  normalizeV30Content(fresh);
  if(!Array.isArray(fresh.log)) fresh.log = [];
  fresh.ideesAteliers = [];
  migratePrivacyData(fresh);
  return fresh;
}

function normalizeMobilityCategories(data){
  const block=data?.blocks?.find(item=>item.id==='mobilite');
  if(!block || !Array.isArray(block.categories)) return;
  const mergeTitles=new Set(['Faire le point sur mes déplacements','Trouver une solution pour mes trajets','Organiser mes déplacements']);
  const sources=block.categories.filter(category=>mergeTitles.has(category.title));
  if(sources.length <= 1) return;
  const existingInternational=block.categories.find(category=>category.title==='Partir à l’étranger');
  const mergedWorkshops=[];
  sources.forEach(category=>(category.ateliers||[]).forEach(atelier=>{
    if(!mergedWorkshops.some(item=>item.title===atelier.title)) mergedWorkshops.push(atelier);
  }));
  const merged={
    title:'Organiser mes déplacements',
    titreJeune:'Organiser mes déplacements',
    titreConseiller:'Diagnostic et solutions de déplacement',
    objectif:'Faire le point sur mes besoins et trouver des solutions adaptées à mes trajets.',
    ateliers:mergedWorkshops
  };
  const international=existingInternational || {
    title:'Partir à l’étranger',
    titreJeune:'Partir à l’étranger',
    titreConseiller:'Mobilité internationale',
    objectif:'Découvrir les possibilités de mobilité internationale et préparer un départ.',
    ateliers:[]
  };
  const otherCategories=block.categories.filter(category=>!mergeTitles.has(category.title) && category.title!=='Partir à l’étranger');
  block.categories=[merged,...otherCategories,international];
}

function normalizeEmploymentCategories(data){
  const block=data?.blocks?.find(item=>item.id==='emploi');
  if(!block || !Array.isArray(block.categories)) return;
  const mergeTitles=new Set(['Préparer ma candidature','Réussir mon entretien','Me préparer à rencontrer un employeur']);
  const sources=block.categories.filter(category=>mergeTitles.has(category.title));
  if(sources.length <= 1) return;
  const mergedWorkshops=[];
  sources.forEach(category=>(category.ateliers||[]).forEach(atelier=>{
    if(!mergedWorkshops.some(item=>item.title===atelier.title)) mergedWorkshops.push(atelier);
  }));
  const merged={
    title:'Me préparer à rencontrer un employeur',
    titreJeune:'Préparer ma candidature',
    titreConseiller:'Préparation candidature (CV, entretien, ciblage)',
    objectif:'Préparer ma candidature et savoir présenter mon parcours face à un employeur.',
    ateliers:mergedWorkshops
  };
  const otherCategories=block.categories.filter(category=>!mergeTitles.has(category.title));
  block.categories=[merged,...otherCategories];
}

function normalizeV30Content(data){
  const descriptions = {
    emploi:'Me préparer, rencontrer des employeurs et découvrir des opportunités.',
    projet:'Mieux me connaître, découvrir des métiers et avancer étape par étape.',
    formation:'Choisir une formation, préparer mon entrée et découvrir les organismes.',
    mobilite:'Organiser mes déplacements, préparer le code ou construire un projet à l’étranger.',
    demarches:'Comprendre mes droits, gérer mes dossiers et devenir plus autonome au quotidien.',
    confiance:'Prendre soin de ma santé, me sentir mieux et développer ma confiance.',
    engagement:'Participer à un projet, devenir bénévole et agir sur mon territoire.',
    'offre-externe':'Découvrir les ateliers proposés avec nos partenaires.'
  };
  (data.blocks||[]).forEach(block=>{
    if(block.id === 'projet' && (!block.titreConseiller || block.titreConseiller === 'PROJET PROFESSIONNEL — Connaissance de soi et construction')){
      block.titreConseiller = 'PROJET PROFESSIONNEL — Connaissance de soi et construction de projet';

    if(!block.introJeune && descriptions[block.id]) block.introJeune = descriptions[block.id];
  });
}

function matchesSearch(block,category,atelier){
  if(!searchQuery)return true;
  const text=workshopSearchText(block,category,atelier);
  if(containsSearchWords(text))return true;
  return getVisibleSessions(atelier).some(session=>containsSearchWords(text+' '+sessionSearchText(session)));
}

function getNextSession(atelier){
  const now=new Date();
  now.setHours(0,0,0,0);
  return getVisibleSessions(atelier)
    .map(session=>({session,date:parseFrenchDate(session.date)}))
    .filter(item=>item.date && item.date>=now)
    .sort((a,b)=>a.date-b.date)[0] || null;
}

function computeAdvisorOverview(){
  let upcoming=0,withoutDate=0,inscrits=0;
  const now=new Date(); now.setHours(0,0,0,0);
  (appData.blocks||[]).forEach(block=>(block.categories||[]).forEach(category=>(category.ateliers||[]).forEach(atelier=>{
    if(!matchesSearch(block,category,atelier)) return;
    const sessions=getVisibleSessions(atelier);
    if(selectedTerritory!=='all' && !sessions.length) return;
    const dated=sessions.map(s=>parseFrenchDate(s.date)).filter(Boolean);
    if(!dated.length) withoutDate++;
    sessions.forEach(session=>{
      const date=parseFrenchDate(session.date);
      if(date && date>=now) upcoming++;
      inscrits+=Number(session.inscrits||0);
    });
  })));
  return {upcoming,withoutDate,inscrits};
}

function parseFrenchDate(str){
  if(!str) return null;
  const m = String(str).trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(!m) return null;
  let [,d,mo,y] = m;
  if(y.length===2) y = '20'+y;
  const date = new Date(Number(y), Number(mo)-1, Number(d));
  return isNaN(date.getTime()) || date.getFullYear()!==Number(y) || date.getMonth()!==Number(mo)-1 || date.getDate()!==Number(d) ? null : date;
}

function collectAllSessions(){

  appData.blocks.forEach(block=>{

          rows.push({
            block, category, atelier, session,
            date: parseFrenchDate(session.date),
            dateLabel: session.date || 'Date non renseignée'
          });
        });
      });
    });
  });
  return rows;
}

function computeStats(){
  let nbAteliers=0, nbSessions=0, nbInscrits=0, sumNotes=0, nbAvis=0;
  const parCategorie = [];
  appData.blocks.forEach(block=>{
    let blockAteliers=0, blockSessions=0, blockInscrits=0;
    block.categories.forEach(category=>{
      (category.ateliers||[]).forEach(atelier=>{
        blockAteliers++;
        (atelier.sessions||[]).forEach(session=>{
          blockSessions++;
          blockInscrits += (session.inscrits||0);
          (session.avis||[]).forEach(a=>{ sumNotes += (a.note||0); nbAvis++; });
        });
      });
    });
    nbAteliers += blockAteliers; nbSessions += blockSessions; nbInscrits += blockInscrits;
    parCategorie.push({label: displayTitle(block), ateliers: blockAteliers, sessions: blockSessions, inscrits: blockInscrits});
  });
  return {nbAteliers, nbSessions, nbInscrits, nbAvis, noteMoyenne: nbAvis ? sumNotes/nbAvis : 0, parCategorie};
}

function csvEscape(value){
  const str = String(value==null ? '' : value);
  return /[";\n]/.test(str) ? '"' + str.replace(/"/g,'""') + '"' : str;
}

function exportAtelierSessionsCSV(bi, ai){
  const atelier = getAtelier(bi, ai);
  if(!atelier) return;
  const header = ['Atelier','Date','Lieu','Horaire','Inscrits'];
  const lines = [header.join(';')];
  const sessions = atelier.sessions||[];
  if(!sessions.length){
    lines.push([atelier.title, '', '', '', 0].map(csvEscape).join(';'));
  } else {
    sessions.forEach(s=>{
      lines.push([atelier.title, s.date||'', s.lieu||'', s.horaire||'', (s.inscrits||0)].map(csvEscape).join(';'));
    });
  }
  const blob = new Blob(['\uFEFF' + lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `sessions_${atelier.title.replace(/[^a-z0-9]+/gi,'_').slice(0,40)}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Export terminé.','success');
}

function exportStatsCSV(){
  const header = ['Categorie','Sous-categorie','Atelier','Date','Lieu','Horaire','Inscrits'];
  const lines = [header.join(';')];
  appData.blocks.forEach(block=>{
    block.categories.forEach(category=>{
      (category.ateliers||[]).forEach(atelier=>{
        const sessions = atelier.sessions||[];
        if(!sessions.length){
          lines.push([displayTitle(block), displayTitle(category), atelier.title, '', '', '', 0].map(csvEscape).join(';'));
        } else {
          sessions.forEach(s=>{
            lines.push([displayTitle(block), displayTitle(category), atelier.title, s.date||'', s.lieu||'', s.horaire||'', (s.inscrits||0)].map(csvEscape).join(';'));
          });
        }
      });
    });
  });
  const blob = new Blob(['\uFEFF' + lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;

  logChange('export', 'Export CSV des statistiques');

let toastSeq = 0;
function showToast(message, type){
  type = type || 'success';
  const scheduleMessage=document.getElementById('scheduleMessage');
  if(scheduleWizard&&scheduleMessage&&document.getElementById('modal').classList.contains('open')){scheduleMessage.textContent=message;scheduleMessage.hidden=false;return;}
  const stack = document.getElementById('toastStack');
  if(!stack){ if(type==='danger'||type==='warning'){ alert(message); } return; }
  const id = 'toast-'+(++toastSeq);
  const iconName = type==='danger' ? 'alert' : type==='warning' ? 'alert' : 'check';
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.id = id;
  el.innerHTML = `<span class="toast-icon">${icon(iconName,'icon-svg-sm')}</span><span>${escapeHtml(message)}</span><button class="toast-close" type="button" aria-label="Fermer la notification">${icon('x','icon-svg-sm')}</button>`;
  el.querySelector('.toast-close').onclick = () => dismissToast(id);
  stack.appendChild(el);
  setTimeout(() => dismissToast(id), 4200);
}
function dismissToast(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.classList.add('leaving');
  setTimeout(() => el.remove(), 200);
}

    atelier?.title,atelier?.titreJeune,atelier?.titreConseiller,atelier?.objectif,

function containsSearchWords(text,query=searchQuery){
  const normalized=normalizeSearchText(text);

function indexedWorkshops(){

function upcomingSessionRows(){
  const today=new Date();today.setHours(0,0,0,0);
  const end=new Date(today);

  return indexedWorkshops().flatMap(entry=>(entry.atelier.sessions||[]).map((session,si)=>({...entry,session,si,date:parseFrenchDate(session.date)})))
    .filter(row=>isSessionVisibleForTerritory(row.session,row.atelier) && row.date && row.date>=today
      && (sessionPeriod==='all'||row.date<end)
      && (!coanimFilter||!document.body.classList.contains('mode-conseiller')||isCoanimationOpen(row.session))
      && containsSearchWords(workshopSearchText(row.block,row.category,row.atelier)+' '+sessionSearchText(row.session)))

/* ====== Dates multiples et duplication ====== */
function isoToFrenchDate(iso){const [y,m,d]=String(iso).split('-');return `${d}/${m}/${y}`;}
function addDaysIso(iso,days){
  const [y,m,d]=iso.split('-').map(Number);const date=new Date(y,m-1,d+days);
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}
function computeScheduleDates(){
  if(!scheduleWizard)return [];
  const first=valueOf('mSessionDate');const dates=new Set();
  if(/^\d{4}-\d{2}-\d{2}$/.test(first)){
    dates.add(first);
    const step=Number(valueOf('mRepeat'))||0;
    const count=Math.min(26,Math.max(2,Number(valueOf('mRepeatCount'))||2));
    if(step)for(let i=1;i<count;i++)dates.add(addDaysIso(first,i*step));
  }
  scheduleWizard.extraDates.forEach(d=>dates.add(d));
  return [...dates].filter(d=>d===first||!scheduleWizard.excludedDates.includes(d)).sort();
}
function addScheduleDate(){
  const input=document.getElementById('mExtraDate');const value=input?.value||'';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(value)){showToast('Choisis une date à ajouter.','warning');input?.focus();return;}
  scheduleWizard.excludedDates=scheduleWizard.excludedDates.filter(d=>d!==value);
  if(!scheduleWizard.extraDates.includes(value))scheduleWizard.extraDates.push(value);
  input.value='';renderScheduleDates();input.focus();
}
function removeScheduleDate(iso){
  if(!scheduleWizard)return;
  scheduleWizard.extraDates=scheduleWizard.extraDates.filter(d=>d!==iso);
  if(!scheduleWizard.excludedDates.includes(iso))scheduleWizard.excludedDates.push(iso);
  renderScheduleDates();
}
function renderScheduleDates(){
  const list=document.getElementById('scheduleDatesList');if(!list||!scheduleWizard)return;
  const wrap=document.getElementById('mRepeatCountWrap');if(wrap)wrap.hidden=!(Number(valueOf('mRepeat'))>0);
  const first=valueOf('mSessionDate');const dates=computeScheduleDates();
  list.innerHTML=dates.map(d=>`<li class="date-chip${d===first?' is-first':''}"><span>${escapeHtml(new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}))}</span>${d===first?'':`<button type="button" aria-label="Retirer la date du ${escAttr(isoToFrenchDate(d))}" title="Retirer cette date" onclick="removeScheduleDate('${d}')">×</button>`}</li>`).join('');
  const summary=document.getElementById('scheduleDatesSummary');
  if(summary)summary.textContent=!dates.length?'Choisis d’abord la date de la session.':dates.length===1?'1 session sera créée.':`${dates.length} sessions seront créées avec les mêmes informations.`+(dates.length>26?' Maximum : 26.':'');
}
function parseHoraire(value){
  const times=[...String(value||'').matchAll(/(\d{1,2})\s*(?:[:hH](\d{2})?)?/g)]
    .map(m=>({h:Number(m[1]),m:Number(m[2]||0)})).filter(t=>t.h<=23&&t.m<=59).slice(0,2)
    .map(t=>`${String(t.h).padStart(2,'0')}:${String(t.m).padStart(2,'0')}`);
  return times.length===2?times:['',''];
}
function applySessionTemplate(template,editing=false){
  const set=(id,value)=>{const el=document.getElementById(id);if(el&&value!==undefined&&value!==null)el.value=value;};
  set('mSessionTerritory',getExplicitSessionTerritoryId(template));
  const [start,end]=parseHoraire(template.horaire);set('mSessionStart',start);set('mSessionEnd',end);
  set('mSessionLieu',template.lieu||'');set('mSessionNotes',template.notes||'');
  set('mStructureType',template.structureType||'');set('mStructureName',template.structureName||'');
  set('mStructureSector',template.sector||'');set('mOrganizerService',template.organizerService||'');
  const coanim=document.getElementById('mCoanimation');if(coanim)coanim.checked=isCoanimationOpen(template);
  const note=document.getElementById('scheduleCopyNote');
  if(editing){
    const d=parseFrenchDate(template.date);
    if(d)set('mSessionDate',`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
    set('mSessionInscription',template.inscription||'');
    const insc=document.getElementById('mSessionInscription');if(insc)refreshInscriptionPreview(insc);
    const multi=document.querySelector('#scheduleFields .multi-dates');if(multi)multi.hidden=true;
    if(note){note.textContent=d?`Modification de la session du ${template.date}. Les inscrits, avis et coanimateurs sont conservés.`:`Modification de la session « ${template.date||'sans date'} » : renseigne une date valide. Les inscrits, avis et coanimateurs sont conservés.`;note.hidden=false;}
  }else if(note){note.textContent=`Copie de la session du ${template.date||'date non renseignée'} : choisis la ou les nouvelles dates, et ajoute le lien d’inscription de la nouvelle session si besoin.`;note.hidden=false;}
  renderScheduleDates();
}

/* ====== Coanimation ======
   Chaque session peut être ouverte ou fermée à la coanimation. Si elle est
   ouverte, un conseiller peut se proposer avec son prénom et son nom. Ces
   informations ne concernent que l’équipe : elles ne s’affichent pas aux jeunes. */
function isCoanimationOpen(session){return session?.coanimation==='ouvert';}
function sessionCoanimateurs(session){return Array.isArray(session?.coanimateurs)?session.coanimateurs.filter(c=>c&&String(c.nom||'').trim()):[];}
function renderCoanimation(s,bi,ai,si){
  const open=isCoanimationOpen(s);const list=sessionCoanimateurs(s);
  const id=`${bi}-${ai}-${si}`;
  const chips=list.length?`<ul class="coanim-list" aria-label="Coanimateurs proposés">${list.map((c,ci)=>`<li class="coanim-chip"><span>${escapeHtml(c.nom)}</span><button type="button" aria-label="Retirer ${escAttr(c.nom)}" title="Retirer" onclick="removeCoanimateur(${bi},${ai},${si},${ci})">×</button></li>`).join('')}</ul>`:'';
  return `<div class="coanim-box for-conseiller${open?' is-open':''}">
    <div class="coanim-head">
      <label class="coanim-switch"><input type="checkbox" role="switch" ${open?'checked':''} onchange="toggleCoanimation(${bi},${ai},${si},this.checked)"><span class="coanim-track" aria-hidden="true"></span><span><b>Coanimation</b> · <span class="coanim-state">${open?'Ouverte':'Fermée'}</span></span></label>
      ${open?`<button class="btn mini primary" type="button" aria-expanded="false" aria-controls="coanim-form-${id}" onclick="showCoanimForm('${id}',this)">Je veux coanimer</button>`:''}
    </div>
    ${open?`<form id="coanim-form-${id}" class="coanim-form" hidden onsubmit="event.preventDefault();addCoanimateur(${bi},${ai},${si},'${id}')">
      <label for="coanim-name-${id}">Ton prénom et ton nom</label>
      <div class="coanim-form-row"><input id="coanim-name-${id}" maxlength="60" autocomplete="name" required><button class="btn mini primary" type="submit">Valider</button><button class="btn mini" type="button" onclick="hideCoanimForm('${id}')">Annuler</button></div>
    </form>`:''}
    ${chips||(open?'<p class="small-note coanim-empty">Personne ne s’est encore proposé.</p>':'')}
    ${!open&&list.length?'<p class="small-note">Coanimation fermée : les personnes déjà proposées restent affichées.</p>':''}
  </div>`;
}
function showCoanimForm(id,button){
  const form=document.getElementById('coanim-form-'+id);if(!form)return;
  form.hidden=false;button?.setAttribute('aria-expanded','true');
  document.getElementById('coanim-name-'+id)?.focus();
}
function hideCoanimForm(id){
  const form=document.getElementById('coanim-form-'+id);if(form)form.hidden=true;
  document.querySelector(`[aria-controls="coanim-form-${id}"]`)?.setAttribute('aria-expanded','false');
}
function toggleCoanimation(bi,ai,si,open){
  const atelier=getAtelier(bi,ai);const session=atelier?.sessions?.[si];if(!session)return;
  session.coanimation=open?'ouvert':'ferme';
  logChange('modification',`Coanimation ${open?'ouverte':'fermée'} — session du ${session.date||'?'} de « ${atelier.title} »`);
  saveData();refreshAndOpenAtelier(bi,ai);
}
function addCoanimateur(bi,ai,si,id){
  const atelier=getAtelier(bi,ai);const session=atelier?.sessions?.[si];if(!session||!isCoanimationOpen(session))return;
  const nom=String(document.getElementById('coanim-name-'+id)?.value||'').replace(/\s+/g,' ').trim().slice(0,60);
  if(!nom){showToast('Indique ton prénom et ton nom.','warning');return;}
  if(!Array.isArray(session.coanimateurs))session.coanimateurs=[];
  if(session.coanimateurs.some(c=>normalizeSearchText(c.nom)===normalizeSearchText(nom))){showToast('Tu es déjà inscrit·e comme coanimateur·rice.','warning');return;}
  session.coanimateurs.push({nom,ts:new Date().toISOString()});
  logChange('modification',`${nom} se propose en coanimation — session du ${session.date||'?'} de « ${atelier.title} »`);
  saveData();refreshAndOpenAtelier(bi,ai);
  showToast('Proposition de coanimation enregistrée.','success');
}
function removeCoanimateur(bi,ai,si,ci){
  const atelier=getAtelier(bi,ai);const session=atelier?.sessions?.[si];const c=session?.coanimateurs?.[ci];if(!c)return;
  if(!confirm(`Retirer ${c.nom} de la coanimation de cette session ?`))return;
  session.coanimateurs.splice(ci,1);
  logChange('modification',`${c.nom} retiré·e de la coanimation — session du ${session.date||'?'} de « ${atelier.title} »`);
  saveData();refreshAndOpenAtelier(bi,ai);
}
function inscriptionPreviewHtml(value){

function normalizeInscriptionInput(input,bi,ai,si){

/* ====== Statut de session ======
   Ouverte par défaut ; « Complet » automatique quand les inscrits atteignent
   les places de l’atelier ; « Complète » ou « Annulée » peuvent être forcées. */
function sessionPlaces(atelier){const n=parseInt(atelier?.places,10);return n>0?n:0;}
function sessionStatus(atelier,s){
  if(s?.statut==='annulee')return 'annulee';
  if(s?.statut==='complete')return 'complete';
  const places=sessionPlaces(atelier);
  return places&&(Number(s?.inscrits)||0)>=places?'complete':'ouverte';
}
function statusBadgeHtml(atelier,s){
  const st=sessionStatus(atelier,s);if(st==='ouverte')return '';
  return `<span class="session-badge status-badge status-${st}">${st==='annulee'?'Annulée':'Complet'}</span>`;
}
function setSessionStatut(bi,ai,si,value){
  const atelier=getAtelier(bi,ai);const session=atelier?.sessions?.[si];if(!session)return;
  const v=['complete','annulee'].includes(value)?value:'';
  if(v)session.statut=v;else delete session.statut;
  logChange('modification',`Session du ${session.date||'?'} de « ${atelier.title} » : ${v==='annulee'?'annulée':v==='complete'?'complète':'statut automatique'}`);
  saveData();refreshAndOpenAtelier(bi,ai);
  if(v==='annulee')showToast('Session annulée. Pense à prévenir les inscrits et à mettre à jour linscription.com.','warning');
}

/* ====== Ajouter à Outlook (.ics) ====== */
function icsEscape(v){return String(v||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/([,;])/g,'\\$1');}
function icsFold(line){
  const out=[];let cur='';
  for(const ch of line){
    if(new TextEncoder().encode(cur+ch).length>73){out.push(cur);cur=' '+ch;}else cur+=ch;
  }
  out.push(cur);return out.join('\r\n');
}
function icsUtc(d){return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');}
function icsDay(d){return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;}
function downloadSessionIcs(bi,ai,si){
  const atelier=getAtelier(bi,ai);const s=atelier?.sessions?.[si];if(!s)return;
  const day=parseFrenchDate(s.date);
  if(!day){showToast('Renseigne d’abord une date valide pour cette session.','warning');return;}
  const [start,end]=parseHoraire(s.horaire);
  const url=linkUrl(s.inscription);
  const coanim=sessionCoanimateurs(s).map(c=>c.nom).join(', ');
  const description=[
    `Atelier : ${displayTitle(atelier)}`,
    `Territoire : ${getSessionTerritoryLabel(s)}`,
    s.horaire?`Horaire : ${s.horaire}`:'',
    url?`Inscription : ${url}`:'',
    coanim?`Coanimation : ${coanim}`:'',
    s.notes?`Notes : ${s.notes}`:'',
    'Offre collective — Mission Locale Pays Basque'
  ].filter(Boolean).join('\n');
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mission Locale Pays Basque//Offre collective//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',
    `UID:${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}@offre-collective-mlpb`,
    `DTSTAMP:${icsUtc(new Date())}`];
  if(start&&end&&end>start){
    const [sh,sm]=start.split(':').map(Number),[eh,em]=end.split(':').map(Number);
    const ds=new Date(day);ds.setHours(sh,sm,0,0);const de=new Date(day);de.setHours(eh,em,0,0);
    lines.push(`DTSTART:${icsUtc(ds)}`,`DTEND:${icsUtc(de)}`);
  }else{
    const next=new Date(day);next.setDate(next.getDate()+1);
    lines.push(`DTSTART;VALUE=DATE:${icsDay(day)}`,`DTEND;VALUE=DATE:${icsDay(next)}`);
  }
  lines.push(`SUMMARY:${icsEscape((sessionStatus(atelier,s)==='annulee'?'[ANNULÉE] ':'')+displayTitle(atelier))}`);
  if(s.lieu)lines.push(`LOCATION:${icsEscape(s.lieu)}`);
  lines.push(`DESCRIPTION:${icsEscape(description)}`);
  if(url)lines.push(`URL:${url}`);
  if(sessionStatus(atelier,s)==='annulee')lines.push('STATUS:CANCELLED');
  lines.push('END:VEVENT','END:VCALENDAR');
  const blob=new Blob([lines.map(icsFold).join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'});
  const slug=normalizeSearchText(displayTitle(atelier)).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'session';
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${slug}_${icsDay(day)}.ics`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  showToast('Événement téléchargé : ouvre le fichier pour l’ajouter à Outlook.','success');
}

    <ol class="wizard-progress" aria-label="Étapes"><li data-step="1">1. Atelier</li><li data-step="2">2. Informations</li><li data-step="3">3. Vérification</li></ol>
    <div class="wizard-scroll">
      <section id="scheduleStep1"><h4>Quel atelier souhaites-tu programmer ?</h4>
        <div class="modal-grid"><div class="full"><label for="scheduleSearch">Rechercher un atelier</label><input id="scheduleSearch" type="search" placeholder="Nom, thème ou mot-clé" oninput="renderScheduleOptions(this.value)"></div>

      <section id="scheduleStep3" hidden><h4>Vérifier avant de créer</h4><div id="scheduleReview"></div><p id="scheduleReviewNote" class="small-note">La session sera ajoutée à l’atelier et enregistrée automatiquement.</p></section>
    </div>
    <p id="scheduleMessage" class="schedule-message" role="alert" hidden></p><div class="actions wizard-actions"><button id="scheduleBack" class="btn" type="button" onclick="scheduleBack()" hidden>Retour</button><button id="scheduleNext" class="btn primary" type="button" onclick="continueSchedule()" disabled>Continuer</button><button id="scheduleReviewBtn" class="btn primary" type="button" onclick="reviewSchedule()" hidden>Vérifier la session</button><button id="scheduleConfirm" class="btn primary" type="button" onclick="confirmAddSession()" hidden>Créer la session</button><button class="btn" type="button" onclick="closeModal()">Annuler</button></div>`;

function renderScheduleOptions(query){
  const entries=indexedWorkshops().filter(e=>containsSearchWords(workshopSearchText(e.block,e.category,e.atelier),query));
  const select=document.getElementById('scheduleAtelier');const previous=select.value;
  select.innerHTML='<option value="">Sélectionner un atelier…</option>'+entries.map(e=>`<option value="${e.bi}:${e.ai}">${escapeHtml(displayTitle(e.atelier))} — ${escapeHtml(displayTitle(e.category))}</option>`).join('');
  select.value=entries.some(e=>`${e.bi}:${e.ai}`===previous)?previous:'';
  document.getElementById('scheduleNext').disabled=!select.value;
  document.getElementById('scheduleCount').textContent=entries.length?`${entries.length} atelier${entries.length>1?'s':''} disponible${entries.length>1?'s':''}`:'Aucun atelier trouvé. Essaie un autre mot.';
}
function continueSchedule(){
  const value=valueOf('scheduleAtelier');
  if(!/^\d+:\d+$/.test(value)){showToast('Choisis un atelier.','warning');return;}
  const [bi,ai]=value.split(':').map(Number);if(!getAtelier(bi,ai))return;
  if(scheduleWizard.bi!==bi||scheduleWizard.ai!==ai||!document.getElementById('mSessionDate'))buildScheduleFields(bi,ai);
  scheduleWizard.bi=bi;scheduleWizard.ai=ai;showScheduleStep(2);
}

    <div class="full"><label for="mSessionTerritory">Territoire de cette session *</label><select id="mSessionTerritory" required>${renderSessionTerritoryOptions(selectedTerritory==='all'?'':selectedTerritory)}</select></div>
    <div class="full"><label for="mSessionDate">Date de la session *</label><input id="mSessionDate" type="date" required onchange="renderScheduleDates()"></div>
    <fieldset class="full multi-dates"><legend>Programmer d’autres dates avec les mêmes informations (facultatif)</legend>
      <div class="multi-dates-grid">
        <div><label for="mRepeat">Répéter</label><select id="mRepeat" onchange="renderScheduleDates()"><option value="0">Non</option><option value="7">Chaque semaine</option><option value="14">Toutes les 2 semaines</option><option value="28">Toutes les 4 semaines</option></select></div>
        <div id="mRepeatCountWrap" hidden><label for="mRepeatCount">Nombre total de sessions</label><input id="mRepeatCount" type="number" min="2" max="26" value="4" oninput="renderScheduleDates()"></div>
      </div>
      <div class="multi-dates-add"><div><label for="mExtraDate">Ajouter une autre date</label><input id="mExtraDate" type="date" onkeydown="if(event.key==='Enter'){event.preventDefault();addScheduleDate();}"></div><button class="btn mini" type="button" onclick="addScheduleDate()">Ajouter cette date</button></div>
      <ul id="scheduleDatesList" class="date-chips" aria-label="Dates qui seront créées"></ul>
      <p id="scheduleDatesSummary" class="field-help" role="status" aria-live="polite"></p>
    </fieldset>
    <div><label for="mSessionStart">Heure de début *</label><input id="mSessionStart" type="time" required></div><div><label for="mSessionEnd">Heure de fin *</label><input id="mSessionEnd" type="time" required></div>
    <div class="full"><label for="mSessionLieu">Lieu ou accès à distance *</label><input id="mSessionLieu" required placeholder="Nom du lieu et adresse, ou visioconférence"></div>
    <div class="full"><label for="mSessionInscription">Lien d’inscription (facultatif)</label><input id="mSessionInscription" type="text" inputmode="url" autocomplete="url" spellcheck="false" placeholder="https://linscription.com/…" oninput="refreshInscriptionPreview(this)">${inscriptionPreviewHtml('')}</div>
    <div class="full"><label for="mSessionNotes">Informations complémentaires (facultatif)</label><textarea id="mSessionNotes"></textarea></div>
    <div class="full coanim-field"><label class="coanim-switch"><input id="mCoanimation" type="checkbox" role="switch"><span class="coanim-track" aria-hidden="true"></span><span><b>Ouvert à la coanimation</b><span class="field-help">Les collègues pourront se proposer avec « Je veux coanimer ».</span></span></label></div>`;
  for(const [id,value] of Object.entries(old)){const el=document.getElementById(id);if(el)el.value=value;}
  const coanim=document.getElementById('mCoanimation');if(coanim&&old.mCoanimation!==undefined)coanim.checked=old.mCoanimation;
  renderScheduleDates();
}
function showScheduleStep(step){
  if(!scheduleWizard)return;scheduleWizard.step=step;
  document.getElementById('scheduleMessage').hidden=true;
  for(let n=1;n<=3;n++){
    document.getElementById('scheduleStep'+n).hidden=n!==step;
    const item=document.querySelector(`.wizard-progress [data-step="${n}"]`);
    if(n===step)item.setAttribute('aria-current','step');else item.removeAttribute('aria-current');
  }
  document.getElementById('scheduleBack').hidden=step===1||(scheduleWizard.editIndex!==null&&step===2);
  document.getElementById('scheduleNext').hidden=step!==1;
  document.getElementById('scheduleReviewBtn').hidden=step!==2;
  document.getElementById('scheduleConfirm').hidden=step!==3;
  document.querySelector('.wizard-scroll').scrollTop=0;
  requestAnimationFrame(()=>document.querySelector(`#scheduleStep${step} input,#scheduleStep${step} select`)?.focus());
}
function scheduleBack(){showScheduleStep(Math.max(1,scheduleWizard.step-1));}
function readScheduleSession(){
  const form=document.getElementById('sessionForm');if(!form)return null;form.classList.add('was-validated');
  const invalid=[...form.querySelectorAll('input,select,textarea')].find(el=>!el.checkValidity()||(el.required&&!el.value.trim()));
  if(invalid){showScheduleStep(2);invalid.focus();invalid.reportValidity();showToast('Complète les champs obligatoires avec des valeurs valides.','warning');return null;}
  const start=valueOf('mSessionStart'),end=valueOf('mSessionEnd');
  if(end<=start){showScheduleStep(2);document.getElementById('mSessionEnd').focus();showToast('L’heure de fin doit être postérieure à l’heure de début.','warning');return null;}
  const rawInscription=valueOf('mSessionInscription').trim();
  const inscription=linkUrl(rawInscription);
  if(rawInscription&&!inscription){showScheduleStep(2);document.getElementById('mSessionInscription').focus();showToast('Le lien d’inscription n’est pas une adresse web valide (exemple : https://linscription.com/…).','warning');return null;}
  const dates=computeScheduleDates();
  if(!dates.length){showScheduleStep(2);document.getElementById('mSessionDate').focus();showToast('Choisis au moins une date.','warning');return null;}
  if(dates.length>26){showScheduleStep(2);showToast('26 sessions au maximum à la fois.','warning');return null;}
  return {dates,session:{structureType:valueOf('mStructureType').trim(),structureName:valueOf('mStructureName').trim(),sector:valueOf('mStructureSector').trim(),organizerService:valueOf('mOrganizerService').trim(),territory:valueOf('mSessionTerritory'),date:isoToFrenchDate(dates[0]),horaire:`${start}–${end}`,lieu:valueOf('mSessionLieu').trim(),inscription,notes:valueOf('mSessionNotes').trim(),coanimation:document.getElementById('mCoanimation')?.checked?'ouvert':'ferme',coanimateurs:[],inscrits:0,avis:[]}};
}
function reviewSchedule(){
  const read=readScheduleSession();if(!read)return;
  const {session,dates}=read;
  const atelier=getAtelier(scheduleWizard.bi,scheduleWizard.ai);
  const rows=[['Atelier',displayTitle(atelier)],['Territoire',TERRITORIES.find(t=>t.id===session.territory)?.label],[dates.length>1?`Dates (${dates.length} sessions)`:'Date',dates.map(isoToFrenchDate).join(', ')],['Horaire',session.horaire],['Lieu',session.lieu],['Inscription',session.inscription?{html:`<a href="${escAttr(session.inscription)}" target="_blank" rel="noopener">${escapeHtml(session.inscription)}</a>`}:'Non renseignée'],['Coanimation',session.coanimation==='ouvert'?'Ouverte':'Fermée'],['Informations complémentaires',session.notes||'Aucune']];
  if(isVisitWorkshop(atelier))rows.push(['Type de structure',session.structureType],['Structure',session.structureName],['Secteur',session.sector],['Service organisateur',session.organizerService]);
  document.getElementById('scheduleReview').innerHTML='<dl class="schedule-review">'+rows.map(([label,value])=>`<div><dt>${escapeHtml(label)}</dt><dd>${value&&value.html?value.html:escapeHtml(value||'')}</dd></div>`).join('')+'</dl>';
  document.getElementById('scheduleReviewNote').textContent=dates.length>1?`${dates.length} sessions seront ajoutées à l’atelier et enregistrées automatiquement.`:'La session sera ajoutée à l’atelier et enregistrée automatiquement.';
  document.getElementById('scheduleConfirm').textContent=scheduleWizard.editIndex!==null?'Enregistrer les modifications':dates.length>1?`Créer les ${dates.length} sessions`:'Créer la session';
  if(scheduleWizard.editIndex!==null)document.getElementById('scheduleReviewNote').textContent='La session sera mise à jour et enregistrée automatiquement.';
  showScheduleStep(3);
}
function confirmAddSession(){
  if(!document.body.classList.contains('mode-conseiller')||!scheduleWizard||scheduleWizard.step!==3||scheduleWizard.committed)return;
  const read=readScheduleSession();if(!read)return;
  const {session,dates}=read;
  const {bi,ai}=scheduleWizard;const atelier=getAtelier(bi,ai);if(!atelier)return;
  scheduleWizard.committed=true;document.getElementById('scheduleConfirm').disabled=true;
  if(!Array.isArray(atelier.sessions))atelier.sessions=[];
  if(scheduleWizard.editIndex!==null){
    const target=atelier.sessions[scheduleWizard.editIndex];if(!target)return;
    const {inscrits,avis,coanimateurs,...fields}=session;
    Object.assign(target,fields,{date:isoToFrenchDate(dates[0])});
    sessionDraftSnapshot=null;scheduleWizard=null;
    logChange('modification',`Session du ${target.date} de « ${atelier.title} »`);
    if(selectedTerritory!=='all'&&selectedTerritory!==target.territory)setTerritory(target.territory);
    directAtelierContext={bi,ai,view:'sessions'};refreshAndOpenAtelier(bi,ai);
    showToast('Session modifiée. Enregistrement automatique en cours.','success');return;
  }
  const key=s=>[s.date,normalizeSearchText(s.horaire).replace(/\s|-|–|—/g,''),normalizeSearchText(s.lieu)].join('|');
  const existing=new Set(atelier.sessions.map(key));
  let created=0,skipped=0;
  dates.forEach(iso=>{
    const copy={...session,date:isoToFrenchDate(iso),coanimateurs:[],avis:[]};
    if(existing.has(key(copy))){skipped++;return;}
    existing.add(key(copy));atelier.sessions.push(copy);created++;
  });
  sessionDraftSnapshot=null;scheduleWizard=null;
  logChange('ajout',created>1?`${created} sessions pour « ${atelier.title} »`:`Session pour « ${atelier.title} »`);
  if(selectedTerritory!=='all'&&selectedTerritory!==session.territory)setTerritory(session.territory);
  directAtelierContext={bi,ai,view:'sessions'};refreshAndOpenAtelier(bi,ai);
  const skippedText=skipped?` ${skipped} date${skipped>1?'s':''} déjà programmée${skipped>1?'s':''} ignorée${skipped>1?'s':''}.`:'';
  showToast((created>1?`${created} sessions créées.`:created?'Session créée.':'Aucune nouvelle session.')+skippedText+(created?' Enregistrement automatique en cours.':''),created?'success':'warning');
}
function sessionFormSnapshot(){
  return JSON.stringify([...document.querySelectorAll('#modalContent input:not(#scheduleSearch),#modalContent select,#modalContent textarea')].map(el=>[el.id,el.type==='checkbox'?el.checked:el.value]));
}
function discardSessionDraft(){
  if(sessionDraftSnapshot!==null&&sessionDraftSnapshot!==sessionFormSnapshot()&&!window.confirm('La session en cours de saisie n’a pas été créée. Abandonner la saisie ?'))return false;
  sessionDraftSnapshot=null;scheduleWizard=null;return true;
}
window.addEventListener('beforeunload',event=>{
  if(sessionDraftSnapshot===null||sessionDraftSnapshot===sessionFormSnapshot())return;
  event.preventDefault();event.returnValue='';
});

function render(){
  updateCatalogControls();
  const listing=catalogView==='sessions'||!!searchQuery;
  document.getElementById('mindmap').hidden=listing;
  document.getElementById('catalogResults').hidden=!listing;
  document.getElementById('catalogResultStatus').textContent='';
  if(catalogView==='sessions'){renderUpcomingSessions();return;}
  if(searchQuery){renderDirectResults();return;}
  const expanded=new Set([...document.querySelectorAll('#mindmap .tile.open')].map(tile=>tile.dataset.block));
  const root = document.getElementById('mindmap');
  root.innerHTML = '';
  updateOverviewStats();
  renderAdvisorOverview();
  let renderedBlocks=0;

  appData.blocks.forEach((block, bi)=>{
    const allEntries = getAtelierEntries(block);
    const visibleEntries=allEntries.filter(entry=>matchesSearch(block,entry.category,entry.atelier));
    if(searchQuery && !visibleEntries.length) return;
    renderedBlocks++;
    const tile = document.createElement('section');
    tile.className = `tile ${block.color}`;
    tile.dataset.block = bi;

    const head = document.createElement('div');
    head.className = 'tile-head';
    const blockLabel=displayTitle(block);
    const bodyId=`tile-body-${bi}`;
    head.setAttribute('role','button');
    head.setAttribute('tabindex','0');
    head.setAttribute('aria-expanded','false');
    head.setAttribute('aria-controls',bodyId);
    head.setAttribute('aria-label',`Ouvrir le bloc ${blockLabel}`);
    head.dataset.blockLabel=blockLabel;
    head.innerHTML = `
      <div class="icon">${iconSvg(block.icon)}</div>
      <h2>${BLOCK_EMOJI[block.id] ? `<span class="tile-emoji" aria-hidden="true">${BLOCK_EMOJI[block.id]}</span>` : ''}${escapeHtml(blockLabel)}</h2>
      ${block.introJeune ? `<p class="intro for-jeune"><em>${escapeHtml(block.introJeune)}</em></p>` : ''}
    `;
    // Toute la tuile fermée et les marges de son en-tête sont actives.
    // Les commandes du corps restent indépendantes.
    tile.addEventListener('click',event=>{
      if(event.target.closest('.tile-body')) return;
      setTileExpanded(tile,!tile.classList.contains('open'));
    });
    head.onkeydown = event=>{
      if(event.key!=='Enter' && event.key!==' ') return;
      event.preventDefault();
      setTileExpanded(tile,!tile.classList.contains('open'));
    };
    tile.appendChild(head);

    const body = document.createElement('div');
    body.className = 'tile-body';
    body.id=bodyId;

    const blockTools = document.createElement('div');
    blockTools.className = 'tile-tools for-conseiller';
    blockTools.innerHTML = `<span class="small-note">${block.categories.length} sous-catégorie${block.categories.length>1?'s':''}</span><span style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn mini subtle editable" type="button" onclick="openBlockTextModal(${bi})">${icon('pencil','icon-svg-sm')} Modifier les textes</button><button class="btn mini editable" type="button" onclick="openCategoryModal(${bi})">${icon('plus','icon-svg-sm')} Sous-catégorie</button></span>`;
    body.appendChild(blockTools);

    block.categories.forEach((category, ci)=>{
      const entries = allEntries
        .map((entry, flatIndex)=>({...entry,flatIndex}))
        .filter(entry=>entry.ci===ci && matchesSearch(block,category,entry.atelier));
      if(searchQuery && !entries.length) return;
      body.appendChild(renderSubcategory(block, category, bi, ci, entries));
    });

    tile.appendChild(body);
    root.appendChild(tile);
    if(expanded.has(String(bi)))setTileExpanded(tile,true);
  });
  if(!renderedBlocks){
    root.innerHTML=`<div class="search-empty">${icon('inbox','icon-svg-sm')} Aucun atelier ne correspond à « ${escapeHtml(document.getElementById('catalogSearch')?.value||'')} ».</div>`;
  }
}

function renderSubcategory(block, category, bi, ci, entries){
  const row=document.createElement('div');
  row.className='subcategory';
  row.addEventListener('click',event=>{
    if(event.target.closest('button,a,input,select,textarea')) return;
    openSubcategory(bi,ci);
  });
  const label = displayTitle(category);
  row.innerHTML=`
    <button class="subcategory-main" type="button" aria-label="Ouvrir la sous-catégorie ${escAttr(label)}, ${entries.length} ateliers" onclick="openSubcategory(${bi},${ci})">
      <span class="subcategory-title">${escapeHtml(label)}</span>
      <span class="count">${entries.length}</span>
    </button>
    <span class="subcategory-actions">
      <button class="icon-action for-conseiller" type="button" aria-label="Modifier la sous-catégorie ${escAttr(label)}" title="Modifier les intitulés" onclick="openCategoryEditModal(${bi},${ci})">${icon('pencil')}</button>
      <button class="icon-action danger for-conseiller" type="button" aria-label="Supprimer la sous-catégorie ${escAttr(label)}" title="Supprimer cette sous-catégorie" onclick="removeCategory(${bi},${ci})">${icon('trash')}</button>
      <button class="icon-action icon-action-nav" type="button" aria-label="Ouvrir la sous-catégorie ${escAttr(label)}" title="Ouvrir cette sous-catégorie" onclick="openSubcategory(${bi},${ci})">${icon('chevron')}</button>
    </span>`;
  return row;
}

function openSubcategory(bi, ci){
  useStandardModal();
  directAtelierContext=null;
  const block=appData.blocks[bi];
  const category=block?.categories?.[ci];
  if(!category) return;
  const entries=getAtelierEntries(block)
    .map((entry,flatIndex)=>({...entry,flatIndex}))
    .filter(entry=>entry.ci===ci && matchesSearch(block,category,entry.atelier));
  const categoryLabel = displayTitle(category);
  document.getElementById('modalTitle').textContent=categoryLabel;
  document.querySelector('.modal-box').classList.add('category-view');
  const content=document.getElementById('modalContent');
  content.innerHTML=`

function getResourcePreviewUrl(atelier){
  const explicit=safeUrl(atelier?.ficheRessourceViewUrl);
  if(explicit) return explicit;
  const resourceUrl=safeUrl(atelier?.ficheRessourceUrl);
  if(!resourceUrl) return '';
  if(atelier?.ficheRessourceType==='web') return resourceUrl;
  try{
    const parsed=new URL(resourceUrl);
    if(parsed.hostname==='drive.google.com'){
      const pathMatch=parsed.pathname.match(/\/file\/d\/([^/]+)/);
      const fileId=pathMatch?.[1] || parsed.searchParams.get('id');
      if(fileId) return `https://drive.google.com/file/d/${encodeURIComponent(fileId)}/preview`;
    }
  }catch(e){}
  return resourceUrl;
}

function renderAtelierResourceActions(atelier){
  const resourceUrl=safeUrl(atelier?.ficheRessourceUrl);
  if(!resourceUrl) return '';
  const previewUrl=getResourcePreviewUrl(atelier);
  const name=atelier.ficheRessourceNom ? `<span class="atelier-resource-name">${escapeHtml(atelier.ficheRessourceNom)}</span>` : '';
  if(atelier.ficheRessourceType==='web'){
    return `<div class="atelier-resource-link">${name}<span class="atelier-resource-actions"><a class="btn mini primary" href="${escAttr(previewUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${icon('link','icon-svg-sm')} Ouvrir le support</a></span></div>`;
  }
  return `<div class="atelier-resource-link">${name}<span class="atelier-resource-actions"><a class="btn mini primary" href="${escAttr(previewUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${icon('eye','icon-svg-sm')} Prévisualiser</a><a class="btn mini subtle" href="${escAttr(resourceUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${icon('download','icon-svg-sm')} Télécharger</a></span></div>`;
}

function toggleAtelierTerritory(bi,ai,territoryId,input){
  const atelier=getAtelier(bi,ai);
  if(!atelier) return;
  const territories=new Set(getAtelierTerritories(atelier));
  input.checked ? territories.add(territoryId) : territories.delete(territoryId);
  if(!territories.size){
    input.checked=true;
    showToast('Conserve au moins un territoire pour cet atelier.','warning');
    return;
  }
  atelier.territories=[...territories];
  saveData();

  if(counter) counter.textContent=`${atelier.territories.length} / ${TERRITORIES.length}`;

    const entry=getAtelierEntry(bi,ai);
    render();

/* ====== Évaluation étoiles + commentaires anonymes ======
   Aucun nom, aucun identifiant : un avis est {note, commentaire, date}.
   Une clé stable (titre + date + horaire) est utilisée pour repérer, dans
   le navigateur de la personne, si elle a déjà donné son avis sur CETTE
   session — pas une vraie protection contre la fraude (personne n’est
   identifié), juste un frein raisonnable contre le double clic. */
function sessionRatingKey(atelier, session){
  return 'rated_' + btoa(unescape(encodeURIComponent((atelier.title||'')+'|'+(session.date||'')+'|'+(session.horaire||'')))).replace(/[^a-zA-Z0-9]/g,'').slice(0,60);
}
function hasAlreadyRated(atelier, session){
  try{ return localStorage.getItem(sessionRatingKey(atelier, session)) === '1'; }catch(e){ return false; }
}
function computeAvis(session){
  const avis = session.avis || [];
  if(!avis.length) return {count:0, average:0};
  const sum = avis.reduce((s,a)=>s+(a.note||0),0);
  return {count:avis.length, average: sum/avis.length};
}
function starsHtml(average, count){
  return `<span class="stars-display">${icon('star','icon-svg-sm star-filled')} ${average.toFixed(1)}</span><span class="small-note">${count} avis</span>`;
}

let __ratingValue = 0;
function openRatingModal(bi, ai, si){
  const atelier = getAtelier(bi, ai);
  const session = atelier.sessions[si];
  if(hasAlreadyRated(atelier, session)){
    showToast('Tu as déjà donné ton avis pour cette session, merci !','warning');
    return;
  }
  __ratingValue = 0;
  useStandardModal();
  document.getElementById('modalTitle').textContent = 'Donner mon avis';
  document.getElementById('modalContent').innerHTML = `
    <p class="small-note" style="margin-bottom:10px;">Ton avis est totalement anonyme — n’indique pas ton nom dans le commentaire.</p>
    <div class="star-picker" id="starPicker">
      ${[1,2,3,4,5].map(n=>`<button type="button" class="star-pick" data-value="${n}" onclick="setRatingValue(${n})" aria-label="${n} étoile${n>1?'s':''}">${icon('star','icon-svg star-pick-icon')}</button>`).join('')}
    </div>
    <div class="modal-grid">
      <div class="full"><label for="mAvisComment">Commentaire (facultatif, anonyme)</label><textarea id="mAvisComment" placeholder="Ce que tu as pensé de cette session..."></textarea></div>
    </div>
    <div class="actions">
      <button class="btn primary" type="button" onclick="confirmSubmitRating(${bi},${ai},${si})">${icon('star','icon-svg-sm')} Envoyer mon avis</button>
      <button class="btn" type="button" onclick="closeModal()">Annuler</button>
    </div>`;
  openModal();
}

function setRatingValue(n){
  __ratingValue = n;
  document.querySelectorAll('#starPicker .star-pick').forEach(btn=>{
    btn.classList.toggle('is-filled', Number(btn.dataset.value) <= n);
  });
}

async function confirmSubmitRating(bi, ai, si){
  if(!__ratingValue){ showToast('Choisis une note de 1 à 5 étoiles.','warning'); return; }
  const atelier = getAtelier(bi, ai);
  const session = atelier.sessions[si];
  const avis = {
    note: __ratingValue,
    commentaire: valueOf('mAvisComment').trim(),
    date: new Date().toISOString()
  };
  setSaveStatus('Envoi…');
  const sent = await postPublicAction('submitRating', {bi, ai, si, avis});
  if(sent){
    session.avis = session.avis || [];
    session.avis.push(avis);
    try{ localStorage.setItem(sessionRatingKey(atelier, session), '1'); }catch(e){}
    saveData();
    closeModal();
    showToast('Merci ! Ton avis a bien été transmis.','success');
    refreshAndOpenAtelier(bi,ai);
  }else{
    showToast('Envoi impossible. Ton avis reste enregistré sur cet appareil : réessaie plus tard.','danger');
  }
}

function openAvisReviewModal(bi, ai){
  const atelier = getAtelier(bi, ai);
  useStandardModal();
  document.getElementById('modalTitle').textContent = 'Avis reçus';
  const rows = [];
  (atelier.sessions||[]).forEach((session, si)=>{
    (session.avis||[]).forEach((avis, vi)=>{
      rows.push({session, si, avis, vi, label: [session.date, session.horaire, session.lieu].filter(Boolean).join(' • ') || `Session ${si+1}`});
    });
  });
  rows.sort((a,b)=> new Date(b.avis.date) - new Date(a.avis.date));
  const body = rows.length ? rows.map(r=>`
    <div class="avis-row-review">
      <div class="avis-row-head">
        <span class="stars-display">${'★'.repeat(r.avis.note)}${'☆'.repeat(5-r.avis.note)}</span>
        <span class="small-note">${escapeHtml(r.label)} · ${escapeHtml(new Date(r.avis.date).toLocaleDateString('fr-FR'))}</span>
        <button class="icon-action danger" type="button" title="Supprimer cet avis" onclick="removeAvis(${bi},${ai},${r.si},${r.vi})">${icon('trash','icon-svg-sm')}</button>
      </div>
      ${r.avis.commentaire ? `<p class="avis-comment">${escapeHtml(r.avis.commentaire)}</p>` : `<p class="small-note">Aucun commentaire</p>`}
    </div>`).join('') : `<div class="empty-note">${icon('inbox','icon-svg-sm')} Aucun avis reçu pour le moment.</div>`;
  document.getElementById('modalContent').innerHTML = `
    <div class="avis-list">${body}</div>
    <div class="actions"><button class="btn" type="button" onclick="closeModal()">Fermer</button></div>`;
  openModal();
}

function removeAvis(bi, ai, si, vi){
  const atelier = getAtelier(bi, ai);
  const session = atelier?.sessions?.[si];
  if(!session || !session.avis || !session.avis[vi]) return;
  session.avis.splice(vi,1);
  logChange('suppression', `Avis supprimé (« ${atelier.title} »)`);
  saveData();
  openAvisReviewModal(bi, ai);
  showToast('Avis supprimé.','success');
}

function sortedSessionEntries(atelier){
  const today=new Date();today.setHours(0,0,0,0);
  const entries=(atelier.sessions||[]).map((session,si)=>({session,si})).filter(e=>isSessionVisibleForTerritory(e.session,atelier));
  const time=e=>parseFrenchDate(e.session.date)?.getTime();
  const upcoming=entries.filter(e=>{const t=time(e);return t===undefined||t>=today.getTime();})
    .sort((a,b)=>(time(a)??Infinity)-(time(b)??Infinity));
  const past=entries.filter(e=>{const t=time(e);return t!==undefined&&t<today.getTime();}).sort((a,b)=>time(b)-time(a));
  return {upcoming,past};
}
function renderSessionList(atelier,bi,ai){
  const visitMode=isVisitWorkshop(atelier);
  const {upcoming,past}=sortedSessionEntries(atelier);

function standardResourceButtons(key){return `<div class="result-actions"><button class="btn mini" type="button" onclick="openStandardResource('${key}')">Ouvrir le PDF remplissable</button><button class="btn mini" type="button" onclick="downloadStandardResource('${key}')">Télécharger</button></div>`;}
const standardResourceUrls={};
function standardResourceUrl(key){
  const resource=STANDARD_RESOURCES[key];if(!resource)return '';
  if(!standardResourceUrls[key])standardResourceUrls[key]=URL.createObjectURL(new Blob([Uint8Array.from(atob(resource.base64),c=>c.charCodeAt(0))],{type:'application/pdf'}));
  return standardResourceUrls[key];
}
function openStandardResource(key){const url=standardResourceUrl(key);if(url)window.open(url,'_blank','noopener');}
function downloadStandardResource(key){
  const url=standardResourceUrl(key);if(!url)return;
  const a=document.createElement('a');a.href=url;a.download=STANDARD_RESOURCES[key].filename;document.body.appendChild(a);a.click();a.remove();
}

    <div class="resource-library"><article><h4>1. Compléter la fiche action</h4><p>Ouvre le modèle, renseigne les champs, puis enregistre le PDF complété sur ton appareil. Tu pourras le modifier à nouveau dans ton lecteur PDF.</p>${standardResourceButtons('action')}</article>
    <article><h4>2. Associer la fiche à l’atelier</h4>
      ${safeUrl(a.ficheRessourceUrl)?`<p>Document actuel : <a href="${escAttr(getResourcePreviewUrl(a))}" target="_blank" rel="noopener">${escapeHtml(a.ficheRessourceNom||'Ouvrir le document')}</a></p><p class="field-help">L’enregistrement d’une nouvelle fiche remplacera ce document dans l’atelier.</p>`:''}
      <label for="mFicheFile">Fiche action complétée (PDF, 8 Mo maximum)</label><input id="mFicheFile" type="file" accept=".pdf,application/pdf">
    </article></div><div class="actions"><button class="btn primary" id="mFicheSaveBtn" type="button" onclick="confirmFiche(${bi},${ai})">Enregistrer la fiche dans l’atelier</button><button class="btn" type="button" onclick="closeModal()">Fermer</button></div>`;openModal();
}
async function confirmFiche(bi,ai){
  if(!document.body.classList.contains('mode-conseiller'))return;
  const a=getAtelier(bi,ai),file=document.getElementById('mFicheFile')?.files?.[0],saveBtn=document.getElementById('mFicheSaveBtn');
  if(!a||!saveBtn||saveBtn.disabled)return;
  if(!file){showToast('Sélectionne la fiche action complétée au format PDF.','warning');return;}
  if(!/\.pdf$/i.test(file.name)||file.size===0||file.size>8*1024*1024){showToast('Choisis un PDF valide de 8 Mo maximum.','warning');return;}
  saveBtn.disabled=true;saveBtn.textContent='Enregistrement de la fiche…';
  try{
    const base64=await fileToBase64(file);
    if(!atob(base64).slice(0,1024).includes('%PDF-'))throw new Error('INVALID_PDF');
    const result=await postSharedAction('uploadResource',{token:getCounselorToken(),name:file.name,mimeType:'application/pdf',base64});
    if(!safeUrl(result?.url))throw new Error('Adresse du fichier absente');
    a.ficheRessourceUrl=result.url;a.ficheRessourceViewUrl=safeUrl(result.viewUrl)||'';a.ficheRessourceNom=result.name||file.name;a.ficheRessourceType=result.type||'file';
    logChange('modification',`Fiche action de « ${a.title} » mise à jour`);
    saveData();closeModal();refreshAndOpenAtelier(bi,ai);showToast('Fiche action associée. Enregistrement automatique en cours.','success');
  }catch(error){
    saveBtn.disabled=false;saveBtn.textContent='Enregistrer la fiche dans l’atelier';
    if(String(error.message||error).includes('ACCES_REFUSE')){
      setCounselorToken('');closeModal();applyMode('jeune');showToast('La session conseillers a expiré. Reconnecte-toi puis réessaie.','danger');
    }else showToast(error.message==='INVALID_PDF'?'Ce fichier n’est pas un PDF valide.':error.message==='VERSION_TEST_UPLOAD'?'Version test : l’ajout d’une fiche action est désactivé.':'Impossible d’enregistrer la fiche. Réessaie lorsque la connexion est disponible.','danger');
  }
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result||'').split(',')[1]||'');
    reader.onerror=()=>reject(reader.error||new Error('Lecture du fichier impossible'));
    reader.readAsDataURL(file);
  });
}

/* ====== Enregistrement partagé (Google Sheets via Apps Script) ======
   Pensé pour être invisible techniquement : un seul bouton « Enregistrer »,
   aucune configuration côté utilisateur. L’URL ci-dessous est réglée une
   seule fois par la personne qui administre l’outil. Tant qu’elle est vide,
   le bouton se contente d’un enregistrement local (comportement précédent),
   sans erreur ni blocage. */
const GOOGLE_SHEET_ENDPOINT = 'version-test-locale'; // VERSION TEST : aucun service distant

/* ====== Compression avant stockage ======
   La cellule Google Sheets est plafonnée à 50 000 caractères. Pour repousser
   cette limite sans changer d’architecture, les données sont compressées
   (gzip natif du navigateur) avant d’être envoyées, et décompressées à la
   lecture. Un préfixe identifie le format pour rester compatible avec :
   - GZIP1: des données compressées (le nouveau format) ;
   - RAW1: un repli non compressé si la compression échoue ou n’est pas
     supportée par le navigateur (aucune interruption pour l’utilisateur) ;
   - aucun préfixe : d’anciennes données déjà enregistrées avant cette
     évolution, toujours lisibles normalement. */
function bytesToBase64(bytes){
  let binary = '';
  const chunkSize = 0x8000;
  for(let i=0; i<bytes.length; i+=chunkSize){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunkSize));
  }
  return btoa(binary);
}
function base64ToBytes(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
async function gzipCompress(text){
  const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
  const buf = await new Response(stream).arrayBuffer();
  return new Uint8Array(buf);
}
async function gzipDecompress(bytes){
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const buf = await new Response(stream).arrayBuffer();
  return new TextDecoder().decode(buf);
}
async function compressForStorage(text){
  try{
    if(typeof CompressionStream === 'undefined') throw new Error('unsupported');
    const bytes = await gzipCompress(text);
    return 'GZIP1:' + bytesToBase64(bytes);
  }catch(e){
    return 'RAW1:' + text;
  }
}
async function decompressFromStorage(payload){
  if(payload.startsWith('GZIP1:')){
    const bytes = base64ToBytes(payload.slice(6));
    return await gzipDecompress(bytes);
  }
  if(payload.startsWith('RAW1:')) return payload.slice(5);
  return payload; // format hérité : JSON brut sans préfixe
}

/* ====== VERSION TEST ======
   Aucune donnée ne quitte le navigateur : la connexion, l’enregistrement,
   les idées et les avis sont simulés localement. */
const TEST_ACCESS_CODE = 'TEST';
async function postSharedAction(action, payload){
  await new Promise(resolve=>setTimeout(resolve,300));
  if(action==='login'){
    if(String(payload?.code||'').trim().toUpperCase()!==TEST_ACCESS_CODE) throw new Error('CODE_INCORRECT');
    return {ok:true, token:'version-test'};
  }
  if(action==='uploadResource') throw new Error('VERSION_TEST_UPLOAD');
  setSaveStatus('À jour');
  return {ok:true};
}

async function postPublicAction(action, payload){
  try{
    await postSharedAction(action,payload);
    return true;
  }catch(err){
    return false;
  }
}

async function saveToSharedSheet(options){
  options=options||{};
  saveData();
  clearTimeout(autoSaveTimer);
  if(sharedSavePromise) return sharedSavePromise;
  sharedSavePromise=performSharedSave(options);
  try{return await sharedSavePromise;}
  finally{sharedSavePromise=null;}
}

async function performSharedSave(options){
  if(!GOOGLE_SHEET_ENDPOINT){
    if(!options.silentSuccess) showToast('Enregistré sur cet appareil uniquement.','warning');
    return false;
  }
  const token=getCounselorToken();
  if(!token){
    setSaveStatus('Accès requis');
    pendingSaveAfterLogin=true;
    if(!options.silentSuccess) showToast('Ta session a expiré. Saisis le code pour reprendre l’enregistrement.','warning');
    if(!options.automatic) openCounselorLogin();
    return false;
  }
  const savingRevision=editRevision;
  const savingSnapshot=JSON.stringify(appData);
  setSaveStatus('Enregistrement…');
  try{
    const payload = await compressForStorage(savingSnapshot);
    await postSharedAction('saveState',{token,payload});
    logChange('sauvegarde', 'Données enregistrées et partagées avec l’équipe');
    saveData(false);
    const moreChanges=editRevision!==savingRevision;
    setDirtyState(moreChanges);
    const savedTime=new Date().toLocaleTimeString('fr-FR').slice(0,5);
    setSaveStatus('Enregistré et partagé à ' + savedTime);
    if(moreChanges) scheduleAutoSave();
    if(!options.silentSuccess && !moreChanges) showToast('Enregistré et partagé à '+savedTime+'.','success');
    return true;
  }catch(err){
    const message=String(err.message||err);
    if(message.includes('ACCES_REFUSE')){
      setCounselorToken('');
      pendingSaveAfterLogin=true;
      setSaveStatus('Session expirée');
      showToast('La session conseillers a expiré. Saisis le code pour reprendre l’enregistrement.','warning');
      if(!options.automatic) openCounselorLogin();
    }else{
      setSaveStatus('Échec du partage · copie locale conservée · réessayer');
      let detail=message;
      if(message.includes('DONNEES_TROP_VOLUMINEUSES')) detail='les données dépassent la capacité de stockage actuelle';
      else if(message.includes('DONNEES_INVALIDES')) detail='le catalogue transmis est invalide';
      else if(message.includes('DONNEES_NOMINATIVES_INTERDITES')) detail='d’anciennes données nominatives sont encore présentes';
      else if(message.includes('ACTION_NON_RECONNUE')) detail='le déploiement Apps Script actif n’est pas la version V35';
      else if(message.includes('Failed to fetch') || message.includes('NetworkError')) detail='le navigateur ne parvient pas à joindre Apps Script';
      showToast('Échec de l’enregistrement : '+detail+'. Les modifications restent sur cet appareil.','danger');
    }
    return false;
  }
}

const TEST_SEED_VERSION = 1;
function testIsoDate(offset){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+offset);return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;}
function testFindWorkshop(patterns,used){
  const all=indexedWorkshops().filter(e=>!isVisitWorkshop(e.atelier)&&!used.has(`${e.bi}:${e.ai}`));
  for(const p of patterns){const hit=all.find(e=>p.test(`${e.atelier.title} ${e.atelier.titreConseiller||''}`));if(hit)return hit;}

}

function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      if(!data.blocks) throw new Error('Format invalide');
      if(!Array.isArray(data.log)) data.log = [];
      if(!Array.isArray(data.ideesAteliers)) data.ideesAteliers = [];
      normalizeV30Content(data);
      appData = data;
      logChange('import', `Fichier « ${file.name} » importé`);
      saveData();
      refresh();
      showToast('Données importées avec succès.','success');
      updateIdeasBadge();
    }catch(err){ showToast('Fichier JSON invalide.','danger'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

    confirmLabel:'Réinitialiser',
    cancelAction:'closeModal()',
    onConfirm: () => {
      const previousLog = appData.log || [];
      const previousIdeas = appData.ideesAteliers || [];
      appData = JSON.parse(JSON.stringify(defaultData));
      appData.log = previousLog;
      appData.ideesAteliers = previousIdeas;
      logChange('réinitialisation', 'Retour à la version de départ');
      saveData();
      refresh();
      closeModal();
      showToast('Outil réinitialisé.','success');
      updateIdeasBadge();
    }
  });
}

/* ====== Lien direct depuis un outil externe (ex. Bienvenue) ======
   ?bloc=emploi ouvre directement le bloc correspondant et y amène la
   personne — pensé pour les recommandations personnalisées du bilan
   de départ, sans rien changer au fonctionnement normal de l'outil. */
function applyDeepLink(){
  try{
    const params = new URLSearchParams(location.search);
    const blocId = params.get('bloc');
    if(!blocId) return;
    const bi = appData.blocks.findIndex(b => b.id === blocId);
    if(bi < 0) return;
    const tile = document.querySelector(`.tile[data-block="${bi}"]`);
    if(tile){
      tile.classList.add('open');
      setTimeout(() => tile.scrollIntoView({behavior:'smooth', block:'start'}), 150);
    }
  }catch(e){}
}

  saveData();
  render();
}

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escAttr(str){
  return escapeHtml(str).replace(/\n/g,'&#10;');
}
/* Lien saisi par un conseiller : accepte « linscription.com/… », « www.… »
   ou « http://… » et le transforme en adresse https:// complète et cliquable. */
function linkUrl(value){
  let raw=String(value||'').trim();if(!raw)return '';
  if(/^http:\/\//i.test(raw))raw='https://'+raw.slice(7);
  else if(!/^[a-z][a-z0-9+.-]*:/i.test(raw)){
    if(/^\/\//.test(raw))raw='https:'+raw;
    else if(/^[^\s\/]+\.[a-z]{2,}(?:[\/?#:]|$)/i.test(raw))raw='https://'+raw;
    else return '';
  }
  try{const url=new URL(raw);if(url.protocol!=='https:'||!url.hostname.includes('.')||/\.(pdf|docx?|xlsx?|pptx?|png|jpe?g|gif|html?|txt|csv)$/i.test(url.hostname))return '';return url.href;}catch(e){return '';}
}
function inscriptionLinkLabel(url){
  try{const u=new URL(url);return (u.hostname.replace(/^www\./,'')+(u.pathname!=='/'?u.pathname:'')).slice(0,60);}catch(e){return url;}
}
function safeUrl(value){
  if(!value) return '';
  try{
    const url = new URL(String(value).trim(), location.href);
    return url.protocol === 'https:' ? url.href : '';
  }catch(e){ return ''; }
}
function valueOf(id){
  const el = document.getElementById(id);
  return el ? el.value : '';
}
let modalReturnFocus = null;
function openModal(){
  const modal = document.getElementById('modal');
  if(!modal.classList.contains('open')) modalReturnFocus = document.activeElement;
  modal.classList.add('open');
  requestAnimationFrame(()=>{
    const first = modal.querySelector('input, select, textarea, button, [href], [tabindex]:not([tabindex="-1"])');
    (first || modal.querySelector('.modal-box'))?.focus();
  });
}
function useStandardModal(){
  document.querySelector('.modal-box').classList.remove('category-view','workshop-form-view','session-wizard');
}
function closeModal(){
  if(!discardSessionDraft())return;
  document.getElementById('modal').classList.remove('open');
  useStandardModal();
  if(modalReturnFocus && document.contains(modalReturnFocus)) modalReturnFocus.focus();
  modalReturnFocus = null;
}
document.addEventListener('keydown', event=>{
  if(event.key === 'Escape' && document.getElementById('modal').classList.contains('open')) closeModal();
});
function refreshAndReopen(bi, ai){
  saveData();
  render();
  const tile = document.querySelector(`[data-block="${bi}"]`);
  if(tile){
    tile.classList.add('open');
    tile.scrollIntoView({behavior:'smooth', block:'start'});
    if(ai !== null && ai !== undefined){
      const atelier = tile.querySelectorAll('.atelier')[ai];
      if(atelier){
        const category = atelier.closest('.subcategory');
        if(category) category.open = true;
        atelier.open = true;
      }
    }
  }
}

function refreshAndOpenAtelier(bi,ai){
  const entry=getAtelierEntry(bi,ai);
  if(!entry) return refresh();
  saveData();
  render();
  if(directAtelierContext?.bi===bi&&directAtelierContext?.ai===ai){
    if(directAtelierContext.view==='sessions'){openSessionsView(bi,ai);return;}
    openAtelierDetail(bi,ai,true);return;
  }
  openSubcategory(bi,entry.ci);
  const atelier=document.querySelector(`.category-workshops .atelier[data-atelier-index="${ai}"]`);
  if(atelier){
    atelier.open=true;
    const sessions=atelier.querySelector('.workshop-sessions-zone .resource-wrap');
    if(sessions) sessions.open=true;
  }
}
