/* ====== Migration RGPD : purge des données nominatives résiduelles ======
   Les inscriptions se font désormais exclusivement sur linscription.com ;
   cet outil ne conserve plus qu'un nombre d'inscrits par session. Cette
   fonction retire tout nom/contact/message qui aurait pu être enregistré
   avant cette évolution, en le convertissant en simple compteur avant
   suppression — aucune régression de la fonctionnalité de comptage,
   suppression complète de la donnée personnelle. */
function migratePrivacyData(data){
  let purgedParticipants = 0, purgedDemandes = 0;
  (data.blocks||[]).forEach(block=>{
    (block.categories||[]).forEach(category=>{
      (category.ateliers||[]).forEach(atelier=>{
        if(Array.isArray(atelier.demandesInscription)){
          purgedDemandes += atelier.demandesInscription.length;
          delete atelier.demandesInscription;
        }
        (atelier.sessions||[]).forEach(session=>{
          if(Array.isArray(session.participants)){
            if(typeof session.inscrits !== 'number') session.inscrits = session.participants.length;
            purgedParticipants += session.participants.length;
            delete session.participants;
          }
          if(!Array.isArray(session.avis)) session.avis = [];
        });
      });
    });
  });
  return {purgedParticipants, purgedDemandes};
}

function loadData(){
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved){
    try{
      const data=JSON.parse(saved);
      normalizeMobilityCategories(data);
      normalizeEmploymentCategories(data);
      normalizeV30Content(data);
      if(!Array.isArray(data.log)) data.log = [];
      if(!Array.isArray(data.ideesAteliers)) data.ideesAteliers = [];
      const migrated = migratePrivacyData(data);
      if(migrated.purgedParticipants || migrated.purgedDemandes){
        data.log.unshift({ts:new Date().toISOString(), action:'confidentialité', label:`Purge RGPD : ${migrated.purgedParticipants} inscription(s) nominative(s) et ${migrated.purgedDemandes} demande(s) converties en comptage anonyme`});
      }
      return data;
    }catch(e){}
  }
  const fresh = JSON.parse(JSON.stringify(defaultData));
  fresh.log = [];
  fresh.ideesAteliers = [];
  return fresh;
}

function normalizeMobilityCategories(data){
  const block=data?.blocks?.find(item=>item.id==='mobilite');
  if(!block || !Array.isArray(block.categories)) return;
  const mergeTitles=new Set(['Faire le point sur mes déplacements','Trouver une solution pour mes trajets','Organiser mes déplacements']);
  const sources=block.categories.filter(category=>mergeTitles.has(category.title));
  if(sources.length <= 1) return;
  const existingInternational=block.categories.find(category=>category.title==='Partir à l’étranger');
  const mergedWorkshops=[];
  sources.forEach(category=>(category.ateliers||[]).forEach(atelier=>{
    if(!mergedWorkshops.some(item=>item.title===atelier.title)) mergedWorkshops.push(atelier);
  }));
  const merged={
    title:'Organiser mes déplacements',
    titreJeune:'Organiser mes déplacements',
    titreConseiller:'Diagnostic et solutions de déplacement',
    objectif:'Faire le point sur mes besoins et trouver des solutions adaptées à mes trajets.',
    ateliers:mergedWorkshops
  };
  const international=existingInternational || {
    title:'Partir à l’étranger',
    titreJeune:'Partir à l’étranger',
    titreConseiller:'Mobilité internationale',
    objectif:'Découvrir les possibilités de mobilité internationale et préparer un départ.',
    ateliers:[]
  };
  const otherCategories=block.categories.filter(category=>!mergeTitles.has(category.title) && category.title!=='Partir à l’étranger');
  block.categories=[merged,...otherCategories,international];
}

function normalizeEmploymentCategories(data){
  const block=data?.blocks?.find(item=>item.id==='emploi');
  if(!block || !Array.isArray(block.categories)) return;
  const mergeTitles=new Set(['Préparer ma candidature','Réussir mon entretien','Me préparer à rencontrer un employeur']);
  const sources=block.categories.filter(category=>mergeTitles.has(category.title));
  if(sources.length <= 1) return;
  const mergedWorkshops=[];
  sources.forEach(category=>(category.ateliers||[]).forEach(atelier=>{
    if(!mergedWorkshops.some(item=>item.title===atelier.title)) mergedWorkshops.push(atelier);
  }));
  const merged={
    title:'Me préparer à rencontrer un employeur',
    titreJeune:'Préparer ma candidature',
    titreConseiller:'Préparation candidature (CV, entretien, ciblage)',
    objectif:'Préparer ma candidature et savoir présenter mon parcours face à un employeur.',
    ateliers:mergedWorkshops
  };
  const otherCategories=block.categories.filter(category=>!mergeTitles.has(category.title));
  block.categories=[merged,...otherCategories];
}

    engagement:'Participer à un projet, devenir bénévole et agir sur mon territoire.',
    'offre-externe':'Découvrir les ateliers proposés avec nos partenaires.'

function displayTitle(item){
  const isConseiller = document.body.classList.contains('mode-conseiller');
  return (isConseiller ? item.titreConseiller : item.titreJeune) || item.title;
}

function parseFrenchDate(str){
  if(!str) return null;
  const m = String(str).trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(!m) return null;
  let [,d,mo,y] = m;
  if(y.length===2) y = '20'+y;
  const date = new Date(Number(y), Number(mo)-1, Number(d));
  return isNaN(date.getTime()) || date.getFullYear()!==Number(y) || date.getMonth()!==Number(mo)-1 || date.getDate()!==Number(d) ? null : date;
}

function collectAllSessions(){
  const rows = [];
  appData.blocks.forEach(block=>{
    block.categories.forEach(category=>{
      (category.ateliers||[]).forEach(atelier=>{
        (atelier.sessions||[]).forEach(session=>{
          rows.push({
            block, category, atelier, session,
            date: parseFrenchDate(session.date),
            dateLabel: session.date || 'Date non renseignée'
          });
        });
      });
    });
  });
  return rows;
}

function computeStats(){
  let nbAteliers=0, nbSessions=0, nbInscrits=0, sumNotes=0, nbAvis=0;
  const parCategorie = [];
  appData.blocks.forEach(block=>{
    let blockAteliers=0, blockSessions=0, blockInscrits=0;
    block.categories.forEach(category=>{
      (category.ateliers||[]).forEach(atelier=>{
        blockAteliers++;
        (atelier.sessions||[]).forEach(session=>{
          blockSessions++;
          blockInscrits += (session.inscrits||0);
          (session.avis||[]).forEach(a=>{ sumNotes += (a.note||0); nbAvis++; });
        });
      });
    });
    nbAteliers += blockAteliers; nbSessions += blockSessions; nbInscrits += blockInscrits;
    parCategorie.push({label: displayTitle(block), ateliers: blockAteliers, sessions: blockSessions, inscrits: blockInscrits});
  });
  return {nbAteliers, nbSessions, nbInscrits, nbAvis, noteMoyenne: nbAvis ? sumNotes/nbAvis : 0, parCategorie};
}

function csvEscape(value){
  const str = String(value==null ? '' : value);
  return /[";\n]/.test(str) ? '"' + str.replace(/"/g,'""') + '"' : str;
}

function exportAtelierSessionsCSV(bi, ai){
  const atelier = getAtelier(bi, ai);
  if(!atelier) return;
  const header = ['Atelier','Date','Lieu','Horaire','Inscrits'];
  const lines = [header.join(';')];
  const sessions = atelier.sessions||[];
  if(!sessions.length){
    lines.push([atelier.title, '', '', '', 0].map(csvEscape).join(';'));
  } else {
    sessions.forEach(s=>{
      lines.push([atelier.title, s.date||'', s.lieu||'', s.horaire||'', (s.inscrits||0)].map(csvEscape).join(';'));
    });
  }
  const blob = new Blob(['\uFEFF' + lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `sessions_${atelier.title.replace(/[^a-z0-9]+/gi,'_').slice(0,40)}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Export terminé.','success');
}

function exportStatsCSV(){
  const header = ['Categorie','Sous-categorie','Atelier','Date','Lieu','Horaire','Inscrits'];
  const lines = [header.join(';')];
  appData.blocks.forEach(block=>{
    block.categories.forEach(category=>{
      (category.ateliers||[]).forEach(atelier=>{
        const sessions = atelier.sessions||[];
        if(!sessions.length){
          lines.push([displayTitle(block), displayTitle(category), atelier.title, '', '', '', 0].map(csvEscape).join(';'));
        } else {
          sessions.forEach(s=>{
            lines.push([displayTitle(block), displayTitle(category), atelier.title, s.date||'', s.lieu||'', s.horaire||'', (s.inscrits||0)].map(csvEscape).join(';'));
          });
        }
      });
    });
  });
  const blob = new Blob(['\uFEFF' + lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `statistiques_ateliers_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  logChange('export', 'Export CSV des statistiques');
}

let toastSeq = 0;
function showToast(message, type){
  type = type || 'success';
  const stack = document.getElementById('toastStack');
  if(!stack){ if(type==='danger'||type==='warning'){ alert(message); } return; }
  const id = 'toast-'+(++toastSeq);
  const iconName = type==='danger' ? 'alert' : type==='warning' ? 'alert' : 'check';
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.id = id;
  el.innerHTML = `<span class="toast-icon">${icon(iconName,'icon-svg-sm')}</span><span>${escapeHtml(message)}</span><button class="toast-close" type="button" aria-label="Fermer la notification">${icon('x','icon-svg-sm')}</button>`;
  el.querySelector('.toast-close').onclick = () => dismissToast(id);
  stack.appendChild(el);
  setTimeout(() => dismissToast(id), 4200);
}
function dismissToast(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.classList.add('leaving');
  setTimeout(() => el.remove(), 200);
}

function confirmAction({title, message, detail, confirmLabel, cancelAction, onConfirm, danger}){
  useStandardModal();
  document.getElementById('modalTitle').textContent = title;
  const actionId = 'confirmAction_'+(++toastSeq);
  window[actionId] = () => { onConfirm(); delete window[actionId]; };
  document.getElementById('modalContent').innerHTML = `
    <div class="delete-confirmation">
      <span class="dc-icon">${icon('alert')}</span>
      <div class="dc-body">
        <p>${escapeHtml(message)}</p>

    <div class="actions">
      <button class="btn ${danger===false?'primary':'primary'}" type="button" onclick="${actionId}()">${escapeHtml(confirmLabel||'Confirmer')}</button>
      <button class="btn" type="button" onclick="${cancelAction||'closeModal()'}">Annuler</button>
    </div>`;
  openModal();
}

function getAtelierEntries(block){
  const entries=[];
  (block.categories || []).forEach((category, ci)=>{
    (category.ateliers || []).forEach((atelier, ai)=>entries.push({category,atelier,ci,ai}));
  });
  return entries;
}

function getAtelierEntry(bi, flatIndex){
  return getAtelierEntries(appData.blocks[bi])[flatIndex];
}

function getAtelier(bi, flatIndex){
  return getAtelierEntry(bi, flatIndex)?.atelier;
}

function render(){
  const root = document.getElementById('mindmap');
  root.innerHTML = '';
  updateOverviewStats();

  appData.blocks.forEach((block, bi)=>{
    const allEntries = getAtelierEntries(block);
    const tile = document.createElement('section');
    tile.className = `tile ${block.color}`;
    tile.dataset.block = bi;

    const head = document.createElement('div');
    head.className = 'tile-head';
    head.innerHTML = `
      <div class="icon">${iconSvg(block.icon)}</div>
      <h2>${BLOCK_EMOJI[block.id] ? `<span class="tile-emoji" aria-hidden="true">${BLOCK_EMOJI[block.id]}</span>` : ''}${escapeHtml(displayTitle(block))}</h2>
      ${block.introJeune ? `<p class="intro for-jeune"><em>${escapeHtml(block.introJeune)}</em></p>` : ''}
    `;
    head.onclick = ()=> tile.classList.toggle('open');
    tile.appendChild(head);

    const body = document.createElement('div');
    body.className = 'tile-body';

    const blockTools = document.createElement('div');
    blockTools.className = 'tile-tools for-conseiller';
    blockTools.innerHTML = `<span class="small-note">${block.categories.length} sous-catégorie${block.categories.length>1?'s':''}</span><span style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn mini subtle editable" type="button" onclick="openBlockTextModal(${bi})">${icon('pencil','icon-svg-sm')} Modifier les textes</button><button class="btn mini editable" type="button" onclick="openCategoryModal(${bi})">${icon('plus','icon-svg-sm')} Sous-catégorie</button></span>`;
    body.appendChild(blockTools);

    block.categories.forEach((category, ci)=>{
      const entries = allEntries
        .map((entry, flatIndex)=>({...entry,flatIndex}))
        .filter(entry=>entry.ci===ci && isVisibleForTerritory(entry.atelier));
      body.appendChild(renderSubcategory(block, category, bi, ci, entries));
    });

    tile.appendChild(body);
    root.appendChild(tile);
  });
}

function renderSubcategory(block, category, bi, ci, entries){
  const row=document.createElement('div');
  row.className='subcategory';
  const label = displayTitle(category);
  row.innerHTML=`
    <button class="subcategory-main" type="button" aria-label="Ouvrir la sous-catégorie ${escAttr(label)}, ${entries.length} ateliers" onclick="openSubcategory(${bi},${ci})">
      <span class="subcategory-title">${escapeHtml(label)}</span>
      <span class="count">${entries.length}</span>
    </button>
    <span class="subcategory-actions">
      <button class="icon-action for-conseiller" type="button" aria-label="Modifier la sous-catégorie ${escAttr(label)}" title="Modifier les intitulés" onclick="openCategoryEditModal(${bi},${ci})">${icon('pencil')}</button>
      <button class="icon-action danger for-conseiller" type="button" aria-label="Supprimer la sous-catégorie ${escAttr(label)}" title="Supprimer cette sous-catégorie" onclick="removeCategory(${bi},${ci})">${icon('trash')}</button>

function openSubcategory(bi, ci){
  const block=appData.blocks[bi];
  const category=block?.categories?.[ci];
  if(!category) return;
  const entries=getAtelierEntries(block)
    .map((entry,flatIndex)=>({...entry,flatIndex}))
    .filter(entry=>entry.ci===ci && isVisibleForTerritory(entry.atelier));
  const categoryLabel = displayTitle(category);
  document.getElementById('modalTitle').textContent=categoryLabel;
  document.querySelector('.modal-box').classList.add('category-view');
  const content=document.getElementById('modalContent');
  content.innerHTML=`
    <div class="category-view-tools">
      <span><b>${entries.length}</b> atelier${entries.length>1?'s':''} pour le territoire sélectionné</span>
      <div class="for-conseiller" style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn mini primary editable" type="button" aria-label="Ajouter un atelier" onclick="openAtelierModal(${bi},${ci})">${icon('plus','icon-svg-sm')} Ajouter un atelier</button>
        <button class="icon-action danger editable" type="button" aria-label="Supprimer la sous-catégorie ${escAttr(categoryLabel)}" title="Supprimer cette sous-catégorie" onclick="removeCategory(${bi},${ci})">${icon('trash')}</button>
      </div>
    </div>
    <div class="category-workshops"></div>`;
  const container=content.querySelector('.category-workshops');
  entries.forEach(entry=>container.appendChild(renderAtelier(block,entry.atelier,bi,entry.flatIndex)));
  if(!entries.length){
    container.innerHTML=`<div class="empty-note">${icon('inbox','icon-svg-sm')} Aucun atelier proposé sur ce territoire pour le moment.</div>`;
  }
  openModal();
}

function toggleAtelier(button){
  const details=button.closest('.atelier');
  if(details) details.open=!details.open;
}

function toggleAtelierTerritory(bi,ai,territoryId,input){
  const atelier=getAtelier(bi,ai);
  if(!atelier) return;
  const territories=new Set(getAtelierTerritories(atelier));
  input.checked ? territories.add(territoryId) : territories.delete(territoryId);
  if(!territories.size){
    input.checked=true;
    showToast('Conserve au moins un territoire pour cet atelier.','warning');
    return;
  }
  atelier.territories=[...territories];
  saveData();
  const counter=input.closest('.atelier-territories')?.querySelector('.atelier-territories-count');
  if(counter) counter.textContent=`${atelier.territories.length} / ${TERRITORIES.length}`;
  if(selectedTerritory!=='all' && !atelier.territories.includes(selectedTerritory)){
    const entry=getAtelierEntry(bi,ai);
    render();
    openSubcategory(bi,entry.ci);
  }
}

/* ====== Évaluation étoiles + commentaires anonymes ======
   Aucun nom, aucun identifiant : un avis est {note, commentaire, date}.
   Une clé stable (titre + date + horaire) est utilisée pour repérer, dans
   le navigateur de la personne, si elle a déjà donné son avis sur CETTE
   session — pas une vraie protection contre la fraude (personne n’est
   identifié), juste un frein raisonnable contre le double clic. */
function sessionRatingKey(atelier, session){
  return 'rated_' + btoa(unescape(encodeURIComponent((atelier.title||'')+'|'+(session.date||'')+'|'+(session.horaire||'')))).replace(/[^a-zA-Z0-9]/g,'').slice(0,60);
}
function hasAlreadyRated(atelier, session){
  try{ return localStorage.getItem(sessionRatingKey(atelier, session)) === '1'; }catch(e){ return false; }
}
function computeAvis(session){
  const avis = session.avis || [];
  if(!avis.length) return {count:0, average:0};
  const sum = avis.reduce((s,a)=>s+(a.note||0),0);
  return {count:avis.length, average: sum/avis.length};
}
function starsHtml(average, count){
  return `<span class="stars-display">${icon('star','icon-svg-sm star-filled')} ${average.toFixed(1)}</span><span class="small-note">${count} avis</span>`;
}

let __ratingValue = 0;
function openRatingModal(bi, ai, si){
  const atelier = getAtelier(bi, ai);
  const session = atelier.sessions[si];
  if(hasAlreadyRated(atelier, session)){
    showToast('Tu as déjà donné ton avis pour cette session, merci !','warning');
    return;
  }
  __ratingValue = 0;
  useStandardModal();
  document.getElementById('modalTitle').textContent = 'Donner mon avis';
  document.getElementById('modalContent').innerHTML = `
    <p class="small-note" style="margin-bottom:10px;">Ton avis est totalement anonyme — n’indique pas ton nom dans le commentaire.</p>
    <div class="star-picker" id="starPicker">
      ${[1,2,3,4,5].map(n=>`<button type="button" class="star-pick" data-value="${n}" onclick="setRatingValue(${n})" aria-label="${n} étoile${n>1?'s':''}">${icon('star','icon-svg star-pick-icon')}</button>`).join('')}
    </div>
    <div class="modal-grid">
      <div class="full"><label for="mAvisComment">Commentaire (facultatif, anonyme)</label><textarea id="mAvisComment" placeholder="Ce que tu as pensé de cette session..."></textarea></div>
    </div>
    <div class="actions">
      <button class="btn primary" type="button" onclick="confirmSubmitRating(${bi},${ai},${si})">${icon('star','icon-svg-sm')} Envoyer mon avis</button>
      <button class="btn" type="button" onclick="closeModal()">Annuler</button>
    </div>`;
  openModal();
}

function setRatingValue(n){
  __ratingValue = n;
  document.querySelectorAll('#starPicker .star-pick').forEach(btn=>{
    btn.classList.toggle('is-filled', Number(btn.dataset.value) <= n);
  });
}

async function confirmSubmitRating(bi, ai, si){
  if(!__ratingValue){ showToast('Choisis une note de 1 à 5 étoiles.','warning'); return; }
  const atelier = getAtelier(bi, ai);
  const session = atelier.sessions[si];
  const avis = {
    note: __ratingValue,
    commentaire: valueOf('mAvisComment').trim(),
    date: new Date().toISOString()
  };
  setSaveStatus('Envoi…');
  const sent = await postPublicAction('submitRating', {bi, ai, si, avis});
  if(sent){
    session.avis = session.avis || [];
    session.avis.push(avis);
    try{ localStorage.setItem(sessionRatingKey(atelier, session), '1'); }catch(e){}
    saveData();
    closeModal();
    showToast('Merci ! Ton avis a bien été transmis.','success');
    refreshAndOpenAtelier(bi,ai);
  }else{
    showToast('Envoi impossible. Ton avis reste enregistré sur cet appareil : réessaie plus tard.','danger');
  }
}

function openAvisReviewModal(bi, ai){
  const atelier = getAtelier(bi, ai);
  useStandardModal();
  document.getElementById('modalTitle').textContent = 'Avis reçus';
  const rows = [];
  (atelier.sessions||[]).forEach((session, si)=>{
    (session.avis||[]).forEach((avis, vi)=>{
      rows.push({session, si, avis, vi, label: [session.date, session.horaire, session.lieu].filter(Boolean).join(' • ') || `Session ${si+1}`});
    });
  });
  rows.sort((a,b)=> new Date(b.avis.date) - new Date(a.avis.date));
  const body = rows.length ? rows.map(r=>`
    <div class="avis-row-review">
      <div class="avis-row-head">
        <span class="stars-display">${'★'.repeat(r.avis.note)}${'☆'.repeat(5-r.avis.note)}</span>
        <span class="small-note">${escapeHtml(r.label)} · ${escapeHtml(new Date(r.avis.date).toLocaleDateString('fr-FR'))}</span>
        <button class="icon-action danger" type="button" title="Supprimer cet avis" onclick="removeAvis(${bi},${ai},${r.si},${r.vi})">${icon('trash','icon-svg-sm')}</button>
      </div>
      ${r.avis.commentaire ? `<p class="avis-comment">${escapeHtml(r.avis.commentaire)}</p>` : `<p class="small-note">Aucun commentaire</p>`}
    </div>`).join('') : `<div class="empty-note">${icon('inbox','icon-svg-sm')} Aucun avis reçu pour le moment.</div>`;
  document.getElementById('modalContent').innerHTML = `
    <div class="avis-list">${body}</div>
    <div class="actions"><button class="btn" type="button" onclick="closeModal()">Fermer</button></div>`;
  openModal();
}

function removeAvis(bi, ai, si, vi){
  const atelier = getAtelier(bi, ai);
  const session = atelier?.sessions?.[si];
  if(!session || !session.avis || !session.avis[vi]) return;
  session.avis.splice(vi,1);
  logChange('suppression', `Avis supprimé (« ${atelier.title} »)`);
  saveData();
  openAvisReviewModal(bi, ai);
  showToast('Avis supprimé.','success');
}

async function confirmFiche(bi, ai){
  const a = getAtelier(bi, ai);
  const file = document.getElementById('mFicheFile')?.files?.[0];
  const webUrl = valueOf('mFicheUrl').trim();
  const removeResource = !!document.getElementById('mFicheRemoveResource')?.checked;
  if(file && webUrl){ showToast('Choisis soit un fichier, soit un lien web.','warning'); return; }
  if(webUrl && !safeUrl(webUrl)){ showToast('Le lien doit commencer par https://','warning'); return; }
  if(file){
    const allowedExtensions = /\.(pdf|doc|docx|jpe?g|png)$/i;
    if(!allowedExtensions.test(file.name)){ showToast('Format non accepté : utilise PDF, Word, JPG ou PNG.','warning'); return; }
    if(file.size > 8 * 1024 * 1024){ showToast('Le fichier dépasse la limite de 8 Mo.','warning'); return; }
  }
  const saveBtn = document.getElementById('mFicheSaveBtn');
  if(saveBtn){ saveBtn.disabled=true; saveBtn.textContent=file?'Téléversement…':'Enregistrement…'; }
  let uploadedResource = null;
  if(file){
    try{
      const base64 = await fileToBase64(file);
      uploadedResource = await postSharedAction('uploadResource', {token:getCounselorToken(), name:file.name, mimeType:file.type, base64});
      if(!uploadedResource?.url) throw new Error('Adresse du fichier absente');
    }catch(error){
      if(saveBtn){ saveBtn.disabled=false; saveBtn.innerHTML=`${icon('check','icon-svg-sm')} Enregistrer la fiche`; }
      if(String(error.message||error).includes('ACCES_REFUSE')){
        setCounselorToken(''); closeModal(); applyMode('jeune');
        showToast('La session conseillers a expiré. Reconnecte-toi puis réessaie.','danger');
      }else{
        showToast('Téléversement impossible. Vérifie la mise à jour Apps Script et réessaie.','danger');
      }
      return;
    }
  }
  a.duree = valueOf('mFicheDuree').trim();
  a.format = valueOf('mFicheFormat');
  a.places = valueOf('mFichePlaces').trim();
  a.intervenant = valueOf('mFicheIntervenant').trim();
  a.prerequis = valueOf('mFichePrerequis').trim();
  if(removeResource){ a.ficheRessourceUrl=''; a.ficheRessourceNom=''; a.ficheRessourceType=''; }
  if(webUrl){ a.ficheRessourceUrl=safeUrl(webUrl); a.ficheRessourceNom='Lien web'; a.ficheRessourceType='web'; }
  if(uploadedResource){
    a.ficheRessourceUrl=uploadedResource.url;
    a.ficheRessourceNom=uploadedResource.name || file.name;
    a.ficheRessourceType=uploadedResource.type || 'file';
  }
  logChange('modification', `Fiche technique mise à jour (« ${a.title} »)`);
  saveData();
  closeModal();
  showToast('Fiche technique enregistrée.','success');
  refreshAndOpenAtelier(bi, ai);
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result||'').split(',')[1]||'');
    reader.onerror=()=>reject(reader.error||new Error('Lecture du fichier impossible'));
    reader.readAsDataURL(file);
  });
}

  render();
  openSubcategory(bi,entry.ci);
  showToast(`Atelier « ${title} » supprimé.`,'success');
}

function openSessionModal(bi, ai){
  const atelier=getAtelier(bi,ai);
  const visitMode=isVisitWorkshop(atelier);
  useStandardModal();
  document.querySelector('.modal-box').classList.add('workshop-form-view');
  document.getElementById('modalTitle').textContent = visitMode?'Programmer une visite':'Créer une session';
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-grid">
      ${visitMode ? `
      <div><label for="mStructureType">Type de structure</label><select id="mStructureType">${renderStructureTypeOptions('')}</select></div>
      <div><label for="mStructureName">Nom de la structure</label><input id="mStructureName" placeholder="Ex. entreprise, CFA ou ESAT"></div>
      <div class="full"><label for="mStructureSector">Secteur d’activité</label><input id="mStructureSector" placeholder="Ex. industrie, propreté, santé, numérique"></div>
      <div class="full"><label for="mOrganizerService">Service organisateur</label><input id="mOrganizerService" list="organizerServiceOptions" placeholder="Ex. ERIP, Service emploi, Betilan ou Service formation"><datalist id="organizerServiceOptions">${renderOrganizerServiceOptions()}</datalist></div>` : ''}
      <div><label>Date</label><input id="mSessionDate" placeholder="JJ/MM/AAAA"></div>
      <div><label>Horaire</label><input id="mSessionHoraire" placeholder="Ex. 9h30-12h"></div>
      <div class="full"><label>Lieu</label><input id="mSessionLieu" placeholder="Lieu / antenne / territoire"></div>
      <div class="full"><label>Lien d’inscription</label><input id="mSessionInscription" placeholder="Lien d’inscription"></div>
      <div class="full"><label>Notes / consignes</label><textarea id="mSessionNotes" placeholder="Informations utiles pour les conseillers"></textarea></div>
    </div>
    <div class="actions">
      <button class="btn primary" type="button" onclick="confirmAddSession(${bi},${ai})">${icon('plus','icon-svg-sm')} ${visitMode?'Créer la visite':'Créer la session'}</button>
      <button class="btn" type="button" onclick="closeModal()">Annuler</button>
    </div>
  `;
  openModal();
}

function confirmAddSession(bi, ai){
  const atelier=getAtelier(bi,ai);
  const visitMode=isVisitWorkshop(atelier);
  const structureType=valueOf('mStructureType').trim();
  const structureName=valueOf('mStructureName').trim();
  const sector=valueOf('mStructureSector').trim();
  const organizerService=valueOf('mOrganizerService').trim();
  if(visitMode && !structureType){ showToast('Sélectionne un type de structure.','warning'); return; }
  if(visitMode && !structureName){ showToast('Renseigne le nom de la structure.','warning'); return; }
  if(visitMode && !sector){ showToast('Renseigne le secteur d’activité.','warning'); return; }
  if(visitMode && !organizerService){ showToast('Renseigne le service organisateur.','warning'); return; }
  atelier.sessions.push({
    structureType,
    structureName,
    sector,
    organizerService,
    date:valueOf('mSessionDate').trim(),
    horaire:valueOf('mSessionHoraire').trim(),
    lieu:valueOf('mSessionLieu').trim(),
    inscription:valueOf('mSessionInscription').trim(),
    notes:valueOf('mSessionNotes').trim(),
    inscrits:0,
    avis:[]
  });
  logChange('ajout', `${visitMode ? 'Visite' : 'Session'} pour « ${atelier.title} »`);
  refreshAndOpenAtelier(bi,ai);
  showToast(visitMode ? 'Visite créée.' : 'Session créée.','success');
}

function addSession(bi, ai){
  openSessionModal(bi, ai);
}
function updateSession(bi, ai, si, field, value){
  getAtelier(bi, ai).sessions[si][field] = value;
  saveData();
}
function removeSession(bi, ai, si){
  const atelier=getAtelier(bi,ai);
  const session=atelier?.sessions?.[si];
  if(!session) return;
  const inscritsCount=(session.inscrits||0);
  confirmAction({
    title:'Supprimer la session',
    message:'Confirmer la suppression de cette session ?',
    detail: inscritsCount ? `${inscritsCount} inscrit${inscritsCount>1?'s':''} comptabilisé${inscritsCount>1?'s':''} seront également perdus.` : null,
    confirmLabel:'Supprimer définitivement',
    cancelAction:`refreshAndOpenAtelier(${bi},${ai})`,
    onConfirm: () => {
      atelier.sessions.splice(si,1);
      logChange('suppression', `Session de « ${atelier.title} »${inscritsCount ? ` — ${inscritsCount} inscrit${inscritsCount>1?'s':''} perdu${inscritsCount>1?'s':''}` : ''}`);
      refreshAndOpenAtelier(bi,ai);
      showToast('Session supprimée.','success');
    }
  });
}
function adjustInscrits(bi, ai, si, delta){
  const session = getAtelier(bi, ai)?.sessions?.[si];
  if(!session) return;
  session.inscrits = Math.max(0, (session.inscrits || 0) + delta);
  saveData();
  refreshAndOpenAtelier(bi,ai);
}

function toggleAll(open){
  document.querySelectorAll('.tile').forEach(tile=>tile.classList.toggle('open', open));
  document.querySelectorAll('.subcategory').forEach(category=>{ category.open = open; });
  document.querySelectorAll('.atelier').forEach(at=>{ at.open = open; });
}

function toggleAdvancedTools(){
  const panel = document.getElementById('advancedTools');
  const btn = document.getElementById('advancedToggleBtn');
  const willShow = panel.hasAttribute('hidden');
  if(willShow){ panel.removeAttribute('hidden'); applyAdminVisibility(); } else panel.setAttribute('hidden','');
  btn.setAttribute('aria-expanded', willShow ? 'true' : 'false');
}

/* ====== Enregistrement partagé (Google Sheets via Apps Script) ======
   Pensé pour être invisible techniquement : un seul bouton « Enregistrer »,
   aucune configuration côté utilisateur. L’URL ci-dessous est réglée une
   seule fois par la personne qui administre l’outil. Tant qu’elle est vide,
   le bouton se contente d’un enregistrement local (comportement précédent),
   sans erreur ni blocage. */
const GOOGLE_SHEET_ENDPOINT = 'https://script.google.com/macros/s/AKfycbwLEChlsqujikD5TID4jf6YZtvbPU2sOCM5J_fzAjFIkcRaTId_iMipjreT-GXg3vK11w/exec';

/* ====== Compression avant stockage ======
   La cellule Google Sheets est plafonnée à 50 000 caractères. Pour repousser
   cette limite sans changer d’architecture, les données sont compressées
   (gzip natif du navigateur) avant d’être envoyées, et décompressées à la
   lecture. Un préfixe identifie le format pour rester compatible avec :
   - GZIP1: des données compressées (le nouveau format) ;
   - RAW1: un repli non compressé si la compression échoue ou n’est pas
     supportée par le navigateur (aucune interruption pour l’utilisateur) ;
   - aucun préfixe : d’anciennes données déjà enregistrées avant cette
     évolution, toujours lisibles normalement. */
function bytesToBase64(bytes){
  let binary = '';
  const chunkSize = 0x8000;
  for(let i=0; i<bytes.length; i+=chunkSize){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunkSize));
  }
  return btoa(binary);
}
function base64ToBytes(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
async function gzipCompress(text){
  const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
  const buf = await new Response(stream).arrayBuffer();
  return new Uint8Array(buf);
}
async function gzipDecompress(bytes){
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const buf = await new Response(stream).arrayBuffer();
  return new TextDecoder().decode(buf);
}
async function compressForStorage(text){
  try{
    if(typeof CompressionStream === 'undefined') throw new Error('unsupported');
    const bytes = await gzipCompress(text);
    return 'GZIP1:' + bytesToBase64(bytes);
  }catch(e){
    return 'RAW1:' + text;
  }
}
async function decompressFromStorage(payload){
  if(payload.startsWith('GZIP1:')){
    const bytes = base64ToBytes(payload.slice(6));
    return await gzipDecompress(bytes);
  }
  if(payload.startsWith('RAW1:')) return payload.slice(5);
  return payload; // format hérité : JSON brut sans préfixe
}

function setSaveStatus(text){
  const el = document.getElementById('saveStatus');
  if(el) el.textContent = text;
}

async function postSharedAction(action, payload){
  if(!GOOGLE_SHEET_ENDPOINT) throw new Error('Service partagé non configuré');
  try{
    const res = await fetch(GOOGLE_SHEET_ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action, payload})
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const result = await res.json();
    if(!result.ok) throw new Error(result.error || 'Échec');
    setSaveStatus('À jour');
    return result;
  }catch(err){
    setSaveStatus('Hors connexion');
    throw err;
  }
}

async function postPublicAction(action, payload){
  try{
    await postSharedAction(action,payload);
    return true;
  }catch(err){
    return false;
  }
}

async function saveToSharedSheet(options){
  options = options || {};
  saveData();
  if(!GOOGLE_SHEET_ENDPOINT){
    if(!options.silentSuccess) showToast('Enregistré sur cet appareil uniquement.','warning');
    return false;
  }
  const token=getCounselorToken();
  if(!token){
    setSaveStatus('Accès requis');
    if(!options.silentSuccess) showToast('Reconnecte-toi à l’entrée conseillers pour enregistrer.','danger');
    applyMode('jeune');
    return false;
  }
  setSaveStatus('Enregistrement…');
  try{
    const payload = await compressForStorage(JSON.stringify(appData));
    await postSharedAction('saveState',{token,payload});
    logChange('sauvegarde', 'Données enregistrées et partagées avec l’équipe');
    saveData();
    setSaveStatus('Enregistré à ' + new Date().toLocaleTimeString('fr-FR').slice(0,5));
    if(!options.silentSuccess) showToast('Enregistré — visible par toute l’équipe.','success');
    return true;
  }catch(err){
    const message=String(err.message||err);
    if(message.includes('ACCES_REFUSE')){
      setCounselorToken('');
      applyMode('jeune');
      setSaveStatus('Session expirée');
      showToast('La session conseillers a expiré. Reconnecte-toi pour enregistrer.','danger');
    }else{
      setSaveStatus('');
      showToast('Connexion impossible : tes modifications restent enregistrées sur cet appareil.','danger');
    }
    return false;
  }
}

async function loadSharedData(){
  if(!GOOGLE_SHEET_ENDPOINT) return;
  try{
    const res = await fetch(GOOGLE_SHEET_ENDPOINT);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const raw = (await res.text()).trim();
    if(!raw || raw === '{}') throw new Error('Réponse vide');
    const text = await decompressFromStorage(raw);
    const data = JSON.parse(text);
    if(!data.blocks) throw new Error('Données invalides');
    if(!Array.isArray(data.log)) data.log = [];
    if(!Array.isArray(data.ideesAteliers)) data.ideesAteliers = [];
    const migrated = migratePrivacyData(data);
    normalizeMobilityCategories(data);
    normalizeEmploymentCategories(data);
    normalizeV30Content(data);
    appData = data;
    if(migrated.purgedParticipants || migrated.purgedDemandes){
      logChange('confidentialité', `Purge RGPD : ${migrated.purgedParticipants} inscription(s) nominative(s) et ${migrated.purgedDemandes} demande(s) converties en comptage anonyme`);
    }
    saveData();
    refresh();
    setSaveStatus('À jour');
    updateIdeasBadge();
    if((migrated.purgedParticipants || migrated.purgedDemandes) && getCounselorToken()){
      await saveToSharedSheet();
      showToast('Des données nominatives ont été retirées automatiquement (RGPD).','success');
    }
  }catch(err){
    setSaveStatus('Hors connexion');
    showToast('Données partagées indisponibles : affichage de la copie enregistrée sur cet appareil.','warning');
  }
}

function exportData(){
  const blob = new Blob([JSON.stringify(appData,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const stamp = new Date().toISOString().slice(0,10);
  a.download = `offre_collective_mlpb_${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      if(!data.blocks) throw new Error('Format invalide');
      if(!Array.isArray(data.log)) data.log = [];
      if(!Array.isArray(data.ideesAteliers)) data.ideesAteliers = [];
      normalizeV30Content(data);
      appData = data;
      logChange('import', `Fichier « ${file.name} » importé`);
      saveData();
      refresh();
      showToast('Données importées avec succès.','success');
      updateIdeasBadge();
    }catch(err){ showToast('Fichier JSON invalide.','danger'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function resetData(){
  confirmAction({
    title:'Réinitialiser l’outil',
    message:'Réinitialiser l’outil avec la version de départ ?',
    detail:'Toutes les modifications non exportées seront perdues.',
    confirmLabel:'Réinitialiser',
    cancelAction:'closeModal()',
    onConfirm: () => {
      const previousLog = appData.log || [];
      const previousIdeas = appData.ideesAteliers || [];
      appData = JSON.parse(JSON.stringify(defaultData));
      appData.log = previousLog;
      appData.ideesAteliers = previousIdeas;
      logChange('réinitialisation', 'Retour à la version de départ');
      saveData();
      refresh();
      closeModal();
      showToast('Outil réinitialisé.','success');
      updateIdeasBadge();
    }
  });
}

/* ====== Lien direct depuis un outil externe (ex. Bienvenue) ======
   ?bloc=emploi ouvre directement le bloc correspondant et y amène la
   personne — pensé pour les recommandations personnalisées du bilan
   de départ, sans rien changer au fonctionnement normal de l'outil. */
function applyDeepLink(){
  try{
    const params = new URLSearchParams(location.search);
    const blocId = params.get('bloc');
    if(!blocId) return;
    const bi = appData.blocks.findIndex(b => b.id === blocId);
    if(bi < 0) return;
    const tile = document.querySelector(`.tile[data-block="${bi}"]`);
    if(tile){
      tile.classList.add('open');
      setTimeout(() => tile.scrollIntoView({behavior:'smooth', block:'start'}), 150);
    }
  }catch(e){}
}

function refresh(){
  saveData();
  render();
}

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escAttr(str){
  return escapeHtml(str).replace(/\n/g,'&#10;');
}
function safeUrl(value){
  if(!value) return '';
  try{
    const url = new URL(String(value).trim(), location.href);
    return url.protocol === 'https:' ? url.href : '';
  }catch(e){ return ''; }
}
function valueOf(id){
  const el = document.getElementById(id);
  return el ? el.value : '';
}
let modalReturnFocus = null;
function openModal(){
  modalReturnFocus = document.activeElement;
  const modal = document.getElementById('modal');
  modal.classList.add('open');
  requestAnimationFrame(()=>{
    const first = modal.querySelector('input, select, textarea, button, [href], [tabindex]:not([tabindex="-1"])');
    (first || modal.querySelector('.modal-box'))?.focus();
  });
}
function useStandardModal(){
  document.querySelector('.modal-box').classList.remove('category-view','workshop-form-view');
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
  useStandardModal();
  if(modalReturnFocus && document.contains(modalReturnFocus)) modalReturnFocus.focus();
  modalReturnFocus = null;
}
document.addEventListener('keydown', event=>{
  if(event.key === 'Escape' && document.getElementById('modal').classList.contains('open')) closeModal();
});
function refreshAndReopen(bi, ai){
  saveData();
  render();
  const tile = document.querySelector(`[data-block="${bi}"]`);
  if(tile){
    tile.classList.add('open');
    tile.scrollIntoView({behavior:'smooth', block:'start'});
    if(ai !== null && ai !== undefined){
      const atelier = tile.querySelectorAll('.atelier')[ai];
      if(atelier){
        const category = atelier.closest('.subcategory');
        if(category) category.open = true;
        atelier.open = true;
      }
    }
  }
}

function refreshAndOpenAtelier(bi,ai){
  const entry=getAtelierEntry(bi,ai);
  if(!entry) return refresh();
  saveData();
  render();
  openSubcategory(bi,entry.ci);
  const atelier=document.querySelector(`.category-workshops .atelier[data-atelier-index="${ai}"]`);
  if(atelier) atelier.open=true;
}

render();
setMode('jeune');
applyDeepLink();
loadSharedData().then(applyDeepLink);
applyAdminVisibility();
updateIdeasBadge();
</script>
